<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<title>Mosaic</title>
<!-- 开发者模式注入位（M1 v1.8 机制沿用）：服务端 -dev 时将 false 替换为 true。
     顶层 const 位于全局词法环境，模块脚本可直接读取。 -->
<script>const MOSAIC_DEV = false;</script>
<!-- 主题引导：首帧前按 localStorage 设定 data-theme，避免暗色默认下的亮色闪屏。 -->
<script>try { document.documentElement.dataset.theme = localStorage.getItem("mosaic.theme") === "light" ? "light" : "dark"; } catch (e) { /* 存储不可用时保持暗色默认 */ }</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
