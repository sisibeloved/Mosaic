openapi: 3.1.0
info:
  title: Mosaic Room API
  version: 0.1.0
  description: |
    Mosaic 个人版本地 HTTP 契约（ADR-0007：OpenAPI 3.1 为 HTTP 面权威描述，oapi-codegen
    生成 Go 服务端边界模型；事件 payload 的权威源仍是 api/room-protocol 的 JSON Schema）。

    形态约束：
    - 单用户本地进程，默认仅回环监听（127.0.0.1:7420）；owner 级 API 当前无认证
      （owner token 属 M2 残留项，计划 v1.10 登记）。
    - 写端点跨源门：Origin 头存在时必须是"回环 host + 配置端口"；带 body 的写端点
      要求 Content-Type: application/json（415/403 语义见各端点响应）。
    - 命令体上限 1MiB（413）；读超时 65s（SSE 无 body GET 不受影响）。
    - 游标为 opaque 字符串：不得解析其内部结构，续传原样回传（RFC-0001 P0）。
    - SSE 订阅：`text/event-stream`，帧格式 `id: <cursor>` + `event: <type>` + `data: <EventView JSON>`；
      断线重连连带 `Last-Event-ID` 头（或 `?cursor=`）从水位续传，不整段重放；
      `draft.update` 为瞬态帧（无 id、断线不补发）；服务端发 `resync_required` 具名事件时
      客户端应走快照恢复。事件类型见 api/room-protocol/events/。
    - 写端点要求 OwnerToken 头（M2，四轮复审 #15 残留收口）：第一方 SPA 经同源
      `GET /v1/owner/bootstrap`（受跨源门保护——DNS rebinding 读不到）取 token；
      命令端点幂等重试自带 token 重放。
servers:
  - url: http://127.0.0.1:7420
    description: 默认回环监听（个人版）
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 存活探针
      responses:
        "200":
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /v1/rooms:
    post:
      operationId: createRoom
      summary: 创建房间（create_room 命令）
      security: [{ OwnerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCommand"
            example:
              command_kind: create_room
              expected_room_version: 0
              idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9001"
              issued_at: "2026-08-30T09:30:00.000Z"
              payload:
                display_name: 第一个房间
      responses:
        "200":
          description: 命令受理（含幂等回放）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/rooms/{room_id}/commands:
    post:
      operationId: submitRoomCommand
      summary: 提交房间命令（post_message / pause_room / resume_room）
      security: [{ OwnerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCommand"
            examples:
              post_message:
                value:
                  command_kind: post_message
                  expected_room_version: 4
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9002"
                  issued_at: "2026-08-30T09:30:01.000Z"
                  payload:
                    body: 一条消息
                    reply_to: null
                    addressed_to: []
                    relations:
                      - { target_event_id: evt_01H8XYZ, kind: extends }
              pause_room:
                value:
                  command_kind: pause_room
                  expected_room_version: 9
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9003"
                  issued_at: "2026-08-30T09:31:00.000Z"
                  payload:
                    reason: 暂停一下
              set_policy:
                value:
                  command_kind: set_policy
                  expected_room_version: 10
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9004"
                  issued_at: "2026-08-31T09:00:00.000Z"
                  payload:
                    mode: roundtable
                    max_speakers: 8
                    lambda: 0.3
                    weights: { relevance: 0.3, novelty: 0.2, diversity: 0.15, urgency: 0.1, direct_address: 0.15, floor_share: 0.05, repetition: 0.05 }
                    intent_window: 30s
                    response_cap: 600
                    reveal_strategy: independent_then_cross
                    rebuttals: 1
      responses:
        "200":
          description: 命令受理（含幂等回放）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/rooms/{room_id}/events:
    get:
      operationId: subscribeRoomEvents
      summary: SSE 订阅房间事件流（opaque cursor 续传）
      description: |
        响应为长流 `text/event-stream`。游标语义：`?cursor=` 或 `Last-Event-ID`（重连）；
        先订阅后追平，position 去重兜底；慢消费者/追平失败发 `resync_required` 具名事件
        （data 含 reason）后断流，客户端携最后 id 重连或走快照。
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: opaque 游标（空 = 从头）；与 Last-Event-ID 同义，query 优先
      responses:
        "200":
          description: 事件流（SSE）
          content:
            text/event-stream:
              schema:
                type: string
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/rooms/{room_id}/snapshot:
    get:
      operationId: getRoomSnapshot
      summary: 快照四元组（版本 + 水位 + 投影/算法版本 + Timeline 投影）
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: 快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/owner/bootstrap:
    get:
      operationId: getOwnerBootstrap
      summary: 第一方客户端引导：返回 owner token（跨源门保护）
      description: |
        仅在配置了 OwnerToken 的装配上注册。响应含写端点所需的 X-Owner-Token 值。
        读取本身过跨源门：Origin 存在且非信任源（回环/壳源）→ 403——DNS rebinding
        页面同源化后也读不到 token（写通道另由 Origin 门 + token 双重把守）。
        无 Origin 的本机客户端（curl/同源 GET）可达——同用户本机进程本就等效 owner。
      responses:
        "200":
          description: token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "403": { $ref: "#/components/responses/OriginRejected" }
        "404":
          description: 本装配未启用 owner token（owner_token_disabled）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/harness/executables:
    get:
      operationId: listHarnessExecutables
      summary: 宿主扫描到的 agent CLI 注册表
      responses:
        "200":
          description: 注册表列表
          content:
            application/json:
              schema:
                type: object
                required: [executables]
                properties:
                  executables:
                    type: array
                    items:
                      $ref: "#/components/schemas/Executable"
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
    post:
      operationId: addHarnessExecutable
      summary: 手动登记 agent CLI（探测失败拒收）
      security: [{ OwnerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualExecutableRequest"
      responses:
        "201":
          description: 已登记
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: registered }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
  /v1/harness/executables/{id}/enable:
    post:
      operationId: enableHarnessExecutable
      summary: 启用可执行项（登录门控；启用后 ≤10s 入座，无需重启）
      security: [{ OwnerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ExecutableID"
      responses:
        "200":
          description: 已启用
          content:
            application/json:
              schema:
                type: object
                required: [status, enabled]
                properties:
                  status: { type: string }
                  enabled: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: login_required（未登录不可启用）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
  /v1/harness/executables/{id}/disable:
    post:
      operationId: disableHarnessExecutable
      summary: 禁用可执行项（座位随 resync 撤出）
      security: [{ OwnerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ExecutableID"
      responses:
        "200":
          description: 已禁用
          content:
            application/json:
              schema:
                type: object
                required: [status, enabled]
                properties:
                  status: { type: string }
                  enabled: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
components:
  securitySchemes:
    OwnerToken:
      type: apiKey
      in: header
      name: X-Owner-Token
      description: 写端点认证（M2）。第一方客户端经 GET /v1/owner/bootstrap（跨源门保护）获取。
  parameters:
    RoomID:
      name: room_id
      in: path
      required: true
      schema: { type: string, pattern: "^room_[0-9A-Za-z_-]+$" }
    ExecutableID:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: 注册表唯一 ID（含路径，URL 编码传递）
  responses:
    BadRequest:
      description: 请求不合法（bad_request / invalid_command / bad_cursor / bad_limit / invalid_entry）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OriginRejected:
      description: 跨源拒绝（origin_rejected——本地 owner API）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 缺少或错误的 X-Owner-Token（owner_token_required）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 版本冲突 / 幂等键指纹冲突（version_conflict / idempotency_conflict）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 房间或条目不存在（room_not_found / not_found）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: 请求体超过 1MiB（body_too_large）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Content-Type 须为 application/json（unsupported_media_type）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    HarnessUnavailable:
      description: 宿主注册表未配置（harness_unavailable）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: 服务端错误（internal / snapshot_failed）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    RoomCommand:
      type: object
      required: [command_kind, expected_room_version, idempotency_key, issued_at, payload]
      additionalProperties: false
      description: |
        命令信封（RFC-0001）。payload 按 command_kind 严格校验（未知字段拒绝）：
        create_room → CreateRoomPayload；post_message → PostMessagePayload；
        pause_room → PauseRoomPayload；resume_room → 空 payload；
        set_policy → PolicyParams（RFC-0003 §3.1.7；变更只在 round 边界生效）。
      properties:
        command_kind:
          type: string
          enum: [create_room, post_message, pause_room, resume_room, set_policy]
        expected_room_version:
          type: integer
          minimum: 0
        idempotency_key:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: UUIDv7（服务端按 tenant+key+kind 去重；同键异指纹 409）
        issued_at:
          type: string
          format: date-time
        payload:
          type: object
    CreateRoomPayload:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 120
    PostMessagePayload:
      type: object
      required: [body]
      additionalProperties: false
      description: 字段集与 events/message.posted.schema.json 对齐（M2 定稿）；relations 项不收 provenance（系统固化 explicit）。
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
        reply_to:
          oneOf:
            - type: "null"
            - type: string
              pattern: "^evt_[0-9A-Za-z_-]+$"
        addressed_to:
          type: array
          maxItems: 3
          items: { type: string, minLength: 1 }
        relations:
          type: array
          items:
            $ref: "#/components/schemas/TypedRelationInput"
        thread_id:
          oneOf:
            - type: "null"
            - type: string
              pattern: "^thr_[0-9A-Za-z_-]+$"
    TypedRelationInput:
      type: object
      required: [target_event_id, kind]
      additionalProperties: false
      properties:
        target_event_id:
          type: string
          pattern: "^evt_[0-9A-Za-z_-]+$"
        kind:
          type: string
          enum: [supports, challenges, extends, questions, evidence_for, supersedes, analogy, relates]
    PauseRoomPayload:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 280
    PolicyParams:
      type: object
      required: [mode, max_speakers, lambda, weights, intent_window, response_cap, reveal_strategy, rebuttals]
      additionalProperties: false
      description: 策略参数束（RFC-0003 §3.1.7；set_policy 命令体与 policy.changed 事件 payload 同构）。reveal 三策略自 B2 起全部可执行（simultaneous=冻结水位统一揭示；independent_then_cross=独立首轮+cross 子轮）。
      properties:
        mode:
          type: string
          enum: [roundtable, open_floor, deep_dive, review, decision]
        max_speakers:
          type: integer
          minimum: 1
          maximum: 8
        lambda:
          type: number
          minimum: 0
          maximum: 1
        weights:
          type: object
          required: [relevance, novelty, diversity, urgency, direct_address, floor_share, repetition]
          additionalProperties: false
          properties:
            relevance: { type: number, minimum: 0, maximum: 0.5 }
            novelty: { type: number, minimum: 0, maximum: 0.5 }
            diversity: { type: number, minimum: 0, maximum: 0.5 }
            urgency: { type: number, minimum: 0, maximum: 0.5 }
            direct_address: { type: number, minimum: 0, maximum: 0.5 }
            floor_share: { type: number, minimum: 0, maximum: 0.5 }
            repetition: { type: number, minimum: 0, maximum: 0.5 }
        intent_window:
          type: string
          pattern: "^[0-9]+(s|m|h)$"
        response_cap:
          type: integer
          format: int64
          minimum: 100
          maximum: 4000
        reveal_strategy:
          type: string
          enum: [sequential, simultaneous, independent_then_cross]
        rebuttals:
          type: integer
          minimum: 0
          maximum: 2
          description: cross 子轮数（Roundtable 默认 1；仅 independent_then_cross 消费）
    CommandResponse:
      type: object
      required: [room_id, event_id, room_version, replayed]
      properties:
        room_id: { type: string }
        event_id: { type: string }
        room_version: { type: integer, format: int64 }
        replayed: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 稳定错误码（transport 与 domain 映射）
            message: { type: string }
    EventView:
      type: object
      required: [event_id, room_id, type, schema_version, occurred_at, actor, visibility, payload, position]
      description: 对外事件视图（RFC-0001 P0：无 seq/tenant_id，opaque position 替代）；payload 的事件族 Schema 见 api/room-protocol/events/。
      properties:
        event_id: { type: string }
        room_id: { type: string }
        thread_id:
          oneOf:
            - type: "null"
            - type: string
        type: { type: string }
        schema_version: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor:
          type: object
          required: [participant_id, kind]
          properties:
            participant_id: { type: string }
            kind: { type: string, enum: [human, agent, system] }
        causation_id:
          oneOf:
            - type: "null"
            - type: string
        correlation_id:
          oneOf:
            - type: "null"
            - type: string
        visibility:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [public, participants, moderators, system] }
            participants:
              type: array
              items: { type: string }
        payload:
          type: object
        position:
          type: string
          description: opaque cursor（续传位点）
    Snapshot:
      type: object
      required: [room_id, room_version, watermark, projection_version, algorithm_version, timeline, policy]
      properties:
        room_id: { type: string }
        room_version: { type: integer, format: int64 }
        watermark: { type: string }
        projection_version: { type: integer, format: int64 }
        algorithm_version: { type: integer, format: int64 }
        policy:
          type: object
          required: [policy_version]
          description: 当前策略区（记分卡透明 OQ-17——权重/模式参数对成员可见、版本化）。
          properties:
            policy_version: { type: string }
            mode: { type: string }
            max_speakers: { type: integer }
            lambda: { type: number }
            weights: { type: object }
            intent_window: { type: string }
            response_cap: { type: integer, format: int64 }
            reveal_strategy: { type: string }
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TimelineItem"
    TimelineItem:
      type: object
      required: [position, event_id, type, actor_id, actor_kind, occurred_at]
      properties:
        position: { type: string }
        event_id: { type: string }
        type: { type: string }
        actor_id: { type: string }
        actor_kind: { type: string }
        body: { type: string }
        thread_id:
          oneOf:
            - type: "null"
            - type: string
        occurred_at: { type: string, format: date-time }
    Executable:
      type: object
      required: [id, adapter, runtime, path, enabled]
      properties:
        id: { type: string, description: 注册表唯一 ID（adapter@runtime:path） }
        adapter: { type: string }
        runtime: { type: string, description: native | wsl }
        distro: { type: string, description: WSL 运行面的发行版（native 为空） }
        path: { type: string }
        version: { type: string }
        digest: { type: string, description: sha256（版本固定门禁用） }
        login_state: { type: string, description: logged_in | logged_out | unknown }
        source: { type: string, description: auto_scan | manual }
        discovered_at: { type: string, format: date-time }
        enabled: { type: boolean }
    ManualExecutableRequest:
      type: object
      required: [adapter, runtime, path]
      additionalProperties: false
      properties:
        adapter: { type: string }
        runtime: { type: string }
        distro: { type: string }
        path: { type: string }
        version: { type: string }
