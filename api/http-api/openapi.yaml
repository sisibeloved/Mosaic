openapi: 3.1.0
info:
  title: Mosaic Room API
  version: 0.1.0
  description: |
    Mosaic 个人版本地 HTTP 契约（ADR-0007：OpenAPI 3.1 为 HTTP 面权威描述，oapi-codegen
    生成 Go 服务端边界模型；事件 payload 的权威源仍是 api/room-protocol 的 JSON Schema）。

    形态约束：
    - 单用户本地进程，默认仅回环监听（127.0.0.1:7420）；owner 级 API 当前无认证
      （owner token 属 M2 残留项，计划 v1.10 登记）。
    - 写端点跨源门：Origin 头存在时必须是"回环 host + 配置端口"；带 body 的写端点
      要求 Content-Type: application/json（415/403 语义见各端点响应）。
    - 命令体上限 1MiB（413）；读超时 65s（SSE 无 body GET 不受影响）。
    - 游标为 opaque 字符串：不得解析其内部结构，续传原样回传（RFC-0001 P0）。
    - SSE 订阅：`text/event-stream`，帧格式 `id: <cursor>` + `event: <type>` + `data: <EventView JSON>`；
      断线重连连带 `Last-Event-ID` 头（或 `?cursor=`）从水位续传，不整段重放；
      `draft.update` 为瞬态帧（无 id、断线不补发）；服务端发 `resync_required` 具名事件时
      客户端应走快照恢复。事件类型见 api/room-protocol/events/。
    - 写端点要求 OwnerToken 头（M2，四轮复审 #15 残留收口）：第一方 SPA 经同源
      `GET /v1/owner/bootstrap`（受跨源门保护——DNS rebinding 读不到）取 token；
      命令端点幂等重试自带 token 重放。
servers:
  - url: http://127.0.0.1:7420
    description: 默认回环监听（个人版）
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: 存活探针
      responses:
        "200":
          description: 服务存活
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
  /v1/rooms:
    get:
      operationId: listRooms
      summary: 房间列表（UI 重设计切片 1）
      description: |
        全量房间摘要，按 last_event_at 倒序（无事件的房间 last_event_at = created_at）。
        只读端点：与既有读面一致，不设 owner token 门（见本文档顶部形态约束）。
      responses:
        "200":
          description: 房间列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomList"
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createRoom
      summary: 创建房间（create_room 命令）
      security: [{ OwnerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCommand"
            example:
              command_kind: create_room
              expected_room_version: 0
              idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9001"
              issued_at: "2026-08-30T09:30:00.000Z"
              payload:
                display_name: 第一个房间
      responses:
        "200":
          description: 命令受理（含幂等回放）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/rooms/{room_id}/commands:
    post:
      operationId: submitRoomCommand
      summary: 提交房间命令（post_message / pause_room / resume_room / rename_room 等）
      security: [{ OwnerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCommand"
            examples:
              post_message:
                value:
                  command_kind: post_message
                  expected_room_version: 4
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9002"
                  issued_at: "2026-08-30T09:30:01.000Z"
                  payload:
                    body: 一条消息
                    reply_to: null
                    addressed_to: []
                    relations:
                      - { target_event_id: evt_01H8XYZ, kind: extends }
              pause_room:
                value:
                  command_kind: pause_room
                  expected_room_version: 9
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9003"
                  issued_at: "2026-08-30T09:31:00.000Z"
                  payload:
                    reason: 暂停一下
              rename_room:
                value:
                  command_kind: rename_room
                  expected_room_version: 11
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9005"
                  issued_at: "2026-08-31T09:05:00.000Z"
                  payload:
                    display_name: 新房间名
              propose_closure:
                value:
                  command_kind: propose_closure
                  expected_room_version: 14
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9006"
                  issued_at: "2026-09-02T02:00:00.000Z"
                  payload:
                    thread_id: null
                    closure_hint: bounded_disagreement
              accept_closure:
                value:
                  command_kind: accept_closure
                  expected_room_version: 18
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9007"
                  issued_at: "2026-09-02T02:05:00.000Z"
                  payload:
                    closure_id: null
              resolve_task:
                value:
                  command_kind: resolve_task
                  expected_room_version: 22
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9008"
                  issued_at: "2026-09-03T08:00:00.000Z"
                  payload:
                    task_id: tsk_abc123def456
                    resolution: delivered
                    note: 数据已拉到并贴出
              edit_memory:
                value:
                  command_kind: edit_memory
                  expected_room_version: 25
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4d9009"
                  issued_at: "2026-09-03T08:10:00.000Z"
                  payload:
                    memory_id: clo_01H8XYZ
                    conclusions: [修正后的结论表述]
                    assumptions: null
                    note: 原结论表述有误，人工纠正
      responses:
        "200":
          description: 命令受理（含幂等回放）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/rooms/{room_id}/events:
    get:
      operationId: subscribeRoomEvents
      summary: SSE 订阅房间事件流（opaque cursor 续传）
      description: |
        响应为长流 `text/event-stream`。游标语义：`?cursor=` 或 `Last-Event-ID`（重连）；
        先订阅后追平，position 去重兜底；慢消费者/追平失败发 `resync_required` 具名事件
        （data 含 reason）后断流，客户端携最后 id 重连或走快照。
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: opaque 游标（空 = 从头）；与 Last-Event-ID 同义，query 优先
      responses:
        "200":
          description: 事件流（SSE）
          content:
            text/event-stream:
              schema:
                type: string
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/rooms/{room_id}/snapshot:
    get:
      operationId: getRoomSnapshot
      summary: 快照（版本 + 水位 + 投影/算法版本 + Timeline 投影 + 房间名/参与者视图）
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: 快照
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/rooms/{room_id}/memory:
    get:
      operationId: getRoomMemory
      summary: 房间记忆视图（胶囊 + 策展条目 + 编辑历史 + 容量水位）
      description: |
        M3-3 记忆查看面（RFC-0007 §7.4 裁定 5）：已接受胶囊的编辑后视图
        （conclusions/assumptions 已应用 memory.edited 链，与语境注入同源不双轨）
        + edit_history（人工编辑留痕）+ capsule_budget（恒常平面容量水位——
        dropped_count > 0 即超预算倒逼合并的信号）。编辑走 edit_memory 命令。
        v1.70 扩展：curated 策展条目（agent 每波评审自助沉淀，Hermes 同构——
        add/replace/remove 操作留痕于 memory.curated 事件、人工纠错同走
        memory.edited）+ curated_budget（策展面水位）。
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: 记忆视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryView"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/rooms/{room_id}/context:
    get:
      operationId: getRoomContext
      summary: 语境平面全景（模型看到的，开发者也能看到）
      description: |
        v1.70 展示对齐（负责人原则）：与引擎组装同源的纯函数快照——近窗原文
        （最新 10 条）、按需召回命中（含检索关键词）、恒常平面（策展条目 +
        胶囊 + 单预算容量水位）、tasklist。零收束也有内容；与注入面共用同一
        投影（不双轨）。
      parameters:
        - $ref: "#/components/parameters/RoomID"
      responses:
        "200":
          description: 语境平面全景
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextPanorama"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/rooms/{room_id}/receipts:
    get:
      operationId: getRoomReceipts
      summary: 上下文回执流水（每次运行实际交付了什么）
      description: |
        v1.70 展示对齐：Context Receipt（RFC-0007 §3.1.7 / AR-16）自 -dev
        调试面提为正式面——每次评估/生成/评审运行的层摘要清单可查（给了什么
        水位、哪些层、摘要为何），最新在前。任务号含语义后缀（:eval/:gen0/
        :mrev 等）可辨运行类型。
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: 返回条数（最新在前）
      responses:
        "200":
          description: 回执流水
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReceiptListView"
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/rooms/{room_id}/search:
    get:
      operationId: searchRoomMessages
      summary: 房内消息全文检索（FTS5 trigram，按需平面）
      description: |
        M3-3 按需检索平面（RFC-0007 §3.1.8 v0.2）：SQLite FTS5 trigram——
        CJK 子串 ≥3 字与英文词均可用（v1.46 spike 实证）；<3 字查询回退
        子串匹配（语义一致）。结果最新在前，position 供时间线跳转定位。
      parameters:
        - $ref: "#/components/parameters/RoomID"
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: 检索词（子串语义）
        - name: actor
          in: query
          required: false
          schema: { type: string }
          description: 按参与者过滤（participant_id）
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 命中列表（最新在前）
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchHit"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/docs:
    get:
      operationId: listDocs
      summary: 文档列表（RFC-0014 §2.8 文档主页）
      description: |
        全部文档摘要（标题/当前版本/生命周期状态/创建者/最近更新时间与更新者），
        updated_at 倒序。created_by = 创建者筛选（"我/各 agent"）；status =
        active/archived 筛选。删除的文档随级联清除不出现。只读端点：与房间读面
        一致，不设 owner token 门（见本文档顶部形态约束）。
      parameters:
        - name: created_by
          in: query
          required: false
          schema: { type: string }
          description: 创建者筛选（participant_id；缺省 = 全部）
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, archived] }
          description: 生命周期状态筛选（缺省 = 全部）
      responses:
        "200":
          description: 文档列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocList"
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
    post:
      operationId: createDoc
      summary: 创建文档（create_doc 命令；doc_id 服务端分配）
      description: |
        创建 = 命令上行（与房间创建同纪律：集合端点 POST = create_doc 命令便捷包装，
        其余变更走 /v1/docs/{doc_id}/commands）。initial_blocks 可选——携带时同事务
        追加首条 revision（空 block_id 由服务端分配）。
      security: [{ OwnerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocCommand"
            example:
              command_kind: create_doc
              expected_doc_version: 0
              idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4da001"
              issued_at: "2026-09-16T09:30:00.000Z"
              payload:
                title: 第一个文档
                format: markdown
                initial_blocks:
                  - { type: paragraph, text: 正文第一段 }
      responses:
        "200":
          description: 命令受理（含幂等回放）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocCommandResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/DocConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/docs/search:
    get:
      operationId: searchDocs
      summary: 文档全文检索（FTS5 trigram，标题+正文派生索引）
      description: |
        RFC-0014 §2.8 全文搜索：复用 room 检索同型设施（FTS5 trigram——CJK 子串
        ≥3 字与英文词均可用；<3 字回退子串匹配）。每文档取最新命中版本，
        version 供编辑器/卡片跳转定位。
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
          description: 检索词（子串语义）
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 命中列表（最新命中版本在前）
          content:
            application/json:
              schema:
                type: object
                required: [hits]
                properties:
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/DocSearchHit"
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/docs/{doc_id}:
    get:
      operationId: getDoc
      summary: 文档快照（当前态：标题/版本/状态/块清单——折叠自 per-doc 事件流）
      parameters:
        - $ref: "#/components/parameters/DocID"
      responses:
        "200":
          description: 文档当前态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocState"
        "404": { $ref: "#/components/responses/DocNotFound" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/docs/{doc_id}/commands:
    post:
      operationId: submitDocCommand
      summary: 提交文档命令（rename_doc / commit_doc_revision / archive_doc / restore_doc / delete_doc / duplicate_doc）
      description: |
        修订批语义（RFC-0014 §2.3）：ops 为一批块操作，版本冲突 409 响应含
        current_version 与当前态 state——客户端在新态上重放本地未提交 ops。
        归档为只读态：rename/revision/archive 拒绝（doc_archived），duplicate/export 允许。
      security: [{ OwnerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/DocID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocCommand"
            examples:
              commit_doc_revision:
                value:
                  command_kind: commit_doc_revision
                  expected_doc_version: 1
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4da002"
                  issued_at: "2026-09-16T09:31:00.000Z"
                  payload:
                    ops:
                      - { op: append, block_id: null, block: { type: paragraph, text: 新增一段 } }
                    note: 首笔修订
              rename_doc:
                value:
                  command_kind: rename_doc
                  expected_doc_version: 2
                  idempotency_key: "018f6b2e-7c1a-7b3d-9e4f-1a2b3c4da003"
                  issued_at: "2026-09-16T09:32:00.000Z"
                  payload:
                    title: 新标题
      responses:
        "200":
          description: 命令受理（含幂等回放）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocCommandResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/DocNotFound" }
        "409": { $ref: "#/components/responses/DocConflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
  /v1/docs/{doc_id}/events:
    get:
      operationId: subscribeDocEvents
      summary: SSE 订阅文档事件流（doc:{id} 频道，cursor = doc version）
      description: |
        响应为长流 `text/event-stream`，语义与房间订阅一致：游标 `?cursor=` 或
        `Last-Event-ID`（重连）；先订阅后追平，position 去重兜底；慢消费者/追平失败
        发 `resync_required` 具名事件（data 含 reason）后断流，客户端携最后 id 重连
        或走快照。房间流不冗余转发文档事件——编辑器与卡片直接订 doc 频道。
      parameters:
        - $ref: "#/components/parameters/DocID"
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: opaque 游标（空 = 从头）；与 Last-Event-ID 同义，query 优先
      responses:
        "200":
          description: 事件流（SSE）
          content:
            text/event-stream:
              schema:
                type: string
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/docs/{doc_id}/sheets:
    get:
      operationId: listDocSheets
      summary: 工作表元信息清单（RFC-0017 M1；仅 format=spreadsheet）
      description: |
        只读端点（不设 owner token 门）。返回工作表清单（稳定 ID/名称/尺寸/
        已填格数）与当前文档版本——编辑器据此外加范围读取组装界面。
      parameters:
        - $ref: "#/components/parameters/DocID"
      responses:
        "200":
          description: 工作表清单
          content:
            application/json:
              schema:
                type: object
                required: [doc_id, version, sheets]
                properties:
                  doc_id: { type: string }
                  version: { type: integer, format: int64 }
                  sheets:
                    type: array
                    items:
                      $ref: "#/components/schemas/SheetMeta"
        "404": { $ref: "#/components/responses/DocNotFound" }
        "409":
          description: 该文档不是表格（format != spreadsheet）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }
  /v1/docs/{doc_id}/sheets/{sheet_id}/range:
    get:
      operationId: getDocSheetRange
      summary: 有界区域读取（类型化单元格 + 公式原文 + 派生值 + 版本）
      description: |
        只读端点。`?range=A1:C10`（缺省 = 已填格 used range，超 10000 格按行
        截断并标记 truncated）；显式范围超限 400。公式格返回服务端权威派生结果
        （kind=value|error|unsupported）。
      parameters:
        - $ref: "#/components/parameters/DocID"
        - name: sheet_id
          in: path
          required: true
          schema: { type: string }
          description: 工作表稳定 ID
        - name: range
          in: query
          required: false
          schema: { type: string, pattern: "^[A-Za-z]{1,3}[0-9]+:[A-Za-z]{1,3}[0-9]+$" }
          description: A1:B2 形态（缺省 = used range）
      responses:
        "200":
          description: 范围视图
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetRangeView"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/DocNotFound" }
        "409":
          description: 该文档不是表格
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500": { $ref: "#/components/responses/Internal" }
  /v1/docs/{doc_id}/export:
    get:
      operationId: exportDoc
      summary: 导出（markdown 文档 → .md；表格文档 → 指定工作表 .csv）
      description: |
        format 分派（RFC-0017 §4.2）：markdown → text/markdown（标题作 H1）；
        spreadsheet → text/csv（快照语义：公式格写当前派生值；`?sheet_id=`
        缺省首表）。归档可导出，删除后 404。
      parameters:
        - $ref: "#/components/parameters/DocID"
        - name: sheet_id
          in: query
          required: false
          schema: { type: string }
          description: 仅 spreadsheet：目标工作表 ID（缺省 = 首表）
      responses:
        "200":
          description: 导出文本
          content:
            text/markdown:
              schema:
                type: string
            text/csv:
              schema:
                type: string
        "400":
          description: spreadsheet 文档未带 sheet_id 且无工作表 / 非表格走 markdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404": { $ref: "#/components/responses/DocNotFound" }
  /v1/agents:
    get:
      operationId: listAgents
      summary: 当前在席 Agent 座位（建房选择的候选集）+ 已发现未启用项
      description: |
        引擎座位快照（已启用的真实适配器 + echo 基线）。participant_id 即建房
        create_room.payload.agents 项与 invite_agent 目标。座位随 harness 启停
        动态变化（10s resync）。disabled 为已发现但未启用的可执行项（v1.24：
        选人页如实展示"还有谁未启用"，指路设置）——仅有 adapter/channel/version，
        无 participant_id（未入席）。
      responses:
        "200":
          description: 座位列表 + 未启用项
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      type: object
                      required: [participant_id, adapter, display_name]
                      properties:
                        participant_id: { type: string }
                        adapter: { type: string }
                        display_name: { type: string }
                  disabled:
                    type: array
                    items:
                      type: object
                      required: [adapter]
                      properties:
                        adapter: { type: string }
                        channel: { type: string }
                        version: { type: string }
  /v1/rooms/{room_id}/attachments:
    post:
      operationId: uploadRoomAttachment
      summary: 上传附件（第一步：落盘 + 返回上传令牌）
      description: |
        RFC-0013 两步上传的第一步。multipart/form-data（字段 file，单文件）；
        写端点门（Origin + X-Owner-Token；Content-Type 为 multipart）。
        令牌 24h 有效、单次消费（post_message.attachments 引用后定稿）。
        单附件 8MiB、每房间总量 512MiB，超限 413。
      parameters:
        - name: room_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: 上传元数据（token 进 post_message.attachments）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttachmentUploadMeta" }
        "413":
          description: 超单文件或房间总量上限
  /v1/rooms/{room_id}/attachments/{attachment_id}:
    get:
      operationId: downloadRoomAttachment
      summary: 下载附件（读路径）
      parameters:
        - name: room_id
          in: path
          required: true
          schema: { type: string }
        - name: attachment_id
          in: path
          required: true
          schema: { type: string, pattern: "^att_[0-9a-z_]+$" }
      responses:
        "200":
          description: 附件字节流（application/octet-stream）
        "404":
          description: 附件不存在
  /v1/system/backups:
    get:
      operationId: listBackups
      summary: 备份列表（新→旧）
      description: |
        M4-0 备份面：每个备份 = VACUUM INTO 一致快照 + manifest（sha256 校验）。
        未装配备份面（测试装配）返回 404。
      responses:
        "200":
          description: 备份摘要列表
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  backups:
                    type: array
                    items: { $ref: "#/components/schemas/BackupSummary" }
    post:
      operationId: createBackup
      summary: 立即备份（VACUUM INTO 一致快照）
      description: |
        写端点（Origin/Content-Type/OwnerToken 三层门）。备份落数据目录
        backups/<id>/，含 manifest。活动进程不停写——VACUUM INTO 是 SQLite
        官方在线备份路径。
      responses:
        "200":
          description: 备份摘要
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSummary" }
  /v1/system/restore:
    post:
      operationId: requestRestore
      summary: 请求恢复（校验 + 落标记；实际换库在下次启动）
      description: |
        写端点（三层门）。两段式：在线段校验备份完整性（sha256）并落
        pending-restore 标记；活动进程握着库文件句柄（Windows 下被握文件不可
        替换），实际换库在下次启动、开库之前执行——被换下的库文件移入
        restore-safety/（回滚保护）。confirm 必须为 true。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backup_id, confirm]
              additionalProperties: false
              properties:
                backup_id: { type: string, pattern: "^bkp_[0-9a-z_]+$" }
                confirm: { type: boolean, enum: [true] }
      responses:
        "200":
          description: 恢复已排程（重启后生效）
          content:
            application/json:
              schema:
                type: object
                required: [restart_required]
                properties:
                  restart_required: { type: boolean }
  /v1/system/diagnostics:
    get:
      operationId: getDiagnostics
      summary: 自诊断报告（版本/环境/数据面/注册表/日志尾打包）
      description: |
        M4-0 自诊断面。内容刻意排除凭据与环境变量（OQ-20 纪律）：版本与运行时、
        数据目录统计（大小/房间数）、座位与注册表状态（adapter/runtime/login）、
        日志尾（最近 N 行）。未装配返回 404。
      responses:
        "200":
          description: 诊断快照（JSON bundle，附加字段随版本演进）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /v1/system/settings:
    get:
      operationId: getSystemSettings
      summary: 设置族（OQ-B 首员：run_timeout_seconds）
      description: |
        引擎可调常量的用户设置（RFC-0012 OQ-B 设置族）。当前成员：
        run_timeout_seconds——独立任务执行时长上限（M4-1；缺省 600s，值域
        60..7200）。未装配设置面（测试装配）返回 404。
      responses:
        "200":
          description: 当前设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsDoc" }
    put:
      operationId: updateSystemSettings
      summary: 更新设置（全量替换；原子落盘）
      description: |
        写端点（三层门）。全量替换语义，未知字段拒绝。变更即刻对新拉起的
        run 生效（引擎活读面；在途 run 不受影响——代次语义与取消一致）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SettingsDoc" }
      responses:
        "200":
          description: 更新后的设置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SettingsDoc" }
        "400":
          description: 载荷不合法或值越界
  /v1/monitors:
    get:
      operationId: listMonitors
      summary: 监控源列表（含运行态水位）
      description: |
        M4-5 监控面：显式监控源（脚本/URL）+ 三水位运行态（观察/处理/送达）。
        未装配监控面（测试装配）返回 404。
      responses:
        "200":
          description: 监控源 + 运行态
          content:
            application/json:
              schema:
                type: object
                required: [monitors]
                properties:
                  monitors:
                    type: array
                    items: { $ref: "#/components/schemas/MonitorView" }
    post:
      operationId: createMonitor
      summary: 登记监控源
      description: |
        写端点（三层门）。script = 绝对路径 + 参数（无 shell，同用户信任面）；
        url = http(s) GET。变化经 run_task 交给 assignee，结果投回 room_id。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorCreate" }
      responses:
        "201":
          description: 已登记（含初始运行态）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonitorView" }
        "400":
          description: 登记项不合法
  /v1/monitors/{monitor_id}:
    delete:
      operationId: deleteMonitor
      summary: 删除监控源（运行态一并清理；已投递历史在房间事件流）
      parameters:
        - name: monitor_id
          in: path
          required: true
          schema: { type: string, pattern: "^mon_[0-9A-Za-z_-]+$" }
      responses:
        "200":
          description: 已删除
        "404":
          description: 不存在
  /v1/monitors/{monitor_id}/enable:
    post:
      operationId: enableMonitor
      summary: 启用（水位保留——恢复后从上次观察续）
      parameters:
        - name: monitor_id
          in: path
          required: true
          schema: { type: string, pattern: "^mon_[0-9A-Za-z_-]+$" }
      responses:
        "200":
          description: 已启用
  /v1/monitors/{monitor_id}/disable:
    post:
      operationId: disableMonitor
      summary: 停用（调度跳过）
      parameters:
        - name: monitor_id
          in: path
          required: true
          schema: { type: string, pattern: "^mon_[0-9A-Za-z_-]+$" }
      responses:
        "200":
          description: 已停用
  /v1/monitors/{monitor_id}/check:
    post:
      operationId: checkMonitor
      summary: 手动触发一次检查（忽略间隔；停用源不调度）
      parameters:
        - name: monitor_id
          in: path
          required: true
          schema: { type: string, pattern: "^mon_[0-9A-Za-z_-]+$" }
      responses:
        "200":
          description: 已检查（结果反映在运行态水位）
  /v1/extdocs/providers:
    get:
      operationId: listExtDocProviders
      summary: 外部文档 provider 清单与凭据状态（RFC-0016 多 provider）
      description: |
        已注册 provider 的状态视图（凭据配置/授权态/验证水位）。未装配外部
        文档面（测试装配）返回 404。
      responses:
        "200":
          description: provider 状态列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtDocProviderList" }
        "404":
          description: 本装配未启用外部文档面
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/extdocs/{provider}/settings:
    get:
      operationId: getExtDocSettings
      summary: provider 凭据状态（不含任何凭据值）
      description: |
        状态字段按 provider 分化（tencent_docs: configured；feishu_docs:
        app_configured/authorized/expires_at）——凭据值永不回传。
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [tencent_docs, feishu_docs] }
      responses:
        "200":
          description: 凭据状态
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtDocSettingsDoc" }
        "404":
          description: 未知 provider 或面未装配（extdocs_bad_provider / extdocs_unavailable）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    put:
      operationId: updateExtDocSettings
      summary: 写入/清除 provider 凭据（0600 原子落盘）
      security: [{ OwnerToken: [] }]
      description: |
        写端点（三层门）。载荷按 provider 分化：tencent_docs 携 token；feishu_docs
        携 app_id + app_secret（两者须同时给，空 = 清除）。凭据仅落本机，不进
        日志、不经任何读端点回传。
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [tencent_docs, feishu_docs] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtDocSettingsUpdate" }
      responses:
        "200":
          description: 凭据状态（无值）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtDocSettingsDoc" }
        "400":
          description: 载荷不合法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/extdocs/{provider}/verify:
    post:
      operationId: verifyExtDoc
      summary: 验证凭据（provider 各自探活）
      security: [{ OwnerToken: [] }]
      description: |
        写端点（三层门）。腾讯 = 上游 tools/list；飞书 = token 有效性（必要时
        刷新成功即证明凭据链健康）。业务失败 200 ok=false 携带上游码。
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, enum: [tencent_docs, feishu_docs] }
      responses:
        "200":
          description: 验证结果
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtDocVerifyResult" }
        "409":
          description: 凭据未配置（extdocs_token_missing）或需重新授权（extdocs_reauth_required）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: 上游不可达/协议错误（extdocs_upstream_error）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/extdocs/shares:
    get:
      operationId: listExtDocShares
      summary: 文档级共享映射列表（doc_id/provider 双过滤可选）
      parameters:
        - name: doc_id
          in: query
          required: false
          schema: { type: string, pattern: "^doc_[0-9a-f]{12}$" }
        - name: provider
          in: query
          required: false
          schema: { type: string, enum: [tencent_docs, feishu_docs] }
      responses:
        "200":
          description: 映射列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtDocShareList" }
        "404":
          description: 面未装配
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: createExtDocShare
      summary: 共享文档到外部云文档（快照语义）
      security: [{ OwnerToken: [] }]
      description: |
        写端点（三层门）。导出 markdown → provider 创建远端文档 → 记录映射。
        已有同 provider 映射且未 force=true → 409 extdocs_already_shared（响应
        携带现有映射）；force=true = 重新创建并替换映射（旧远端文档保留）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtDocShareRequest" }
      responses:
        "201":
          description: 已共享（含远端 URL）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtDocShare" }
        "400":
          description: 载荷不合法
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 文档不存在（extdocs_doc_not_found）或未知 provider（extdocs_bad_provider）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 已有映射 / 凭据未配置 / 需重新授权
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: 上游失败（extdocs_upstream_error；message 含上游错误码摘要）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/extdocs/shares/{doc_id}:
    delete:
      operationId: deleteExtDocShare
      summary: 解除共享映射（仅本地映射，不删远端文档）
      security: [{ OwnerToken: [] }]
      parameters:
        - name: doc_id
          in: path
          required: true
          schema: { type: string, pattern: "^doc_[0-9a-f]{12}$" }
        - name: provider
          in: query
          required: true
          schema: { type: string, enum: [tencent_docs, feishu_docs] }
      responses:
        "200":
          description: 已解除
        "404":
          description: 映射不存在或面未装配
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/extdocs/resolve:
    post:
      operationId: resolveExtDocLink
      summary: 解析外部文档链接为卡片描述子（按 host 分派 provider）
      security: [{ OwnerToken: [] }]
      description: |
        写端点（三层门；会触发出网）。仅接受已注册 provider 白名单 host 的
        https 链接（SSRF 防线）；title 尽力拉取（同 host 重定向才跟随），
        失败降级为空。Composer 发送前调用，产物填入 post_message 的 external_refs。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExtDocLinkResolveRequest" }
      responses:
        "200":
          description: 解析结果（拉取失败也是 200——title 空，卡片降级）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtDocLinkInfo" }
        "400":
          description: 非白名单链接（extdocs_bad_link）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/extdocs/feishu/authorize:
    get:
      operationId: getFeishuAuthorizeURL
      summary: 飞书授权页 URL（设置页"登录飞书"打开）
      description: |
        需先保存 app_id/app_secret。返回授权 URL 与须在飞书后台登记的
        redirect_uri（完全一致）。授权后浏览器跳转 redirect_uri?code=...——
        页面打不开无妨，从地址栏复制 code 调 callback 端点。
      responses:
        "200":
          description: 授权 URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeishuAuthorizeInfo" }
        "409":
          description: 应用凭据未配置（extdocs_token_missing）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/extdocs/feishu/callback:
    post:
      operationId: feishuOAuthCallback
      summary: 授权码换取 user_access_token（手动粘 code 路径）
      security: [{ OwnerToken: [] }]
      description: |
        写端点（三层门）。code 单次有效且时效短（约 5 分钟）——粘贴后即刻
        提交；token 与 refresh_token 持久化（轮换语义自动维护）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeishuCallbackRequest" }
      responses:
        "200":
          description: 已绑定（含到期时间）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExtDocSettingsDoc" }
        "409":
          description: 应用凭据未配置 / 需重新授权
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: 上游交换失败（extdocs_upstream_error）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/extdocs/sheet-transfers/preview:
    post:
      operationId: previewSheetTransfer
      summary: 表格交换预览（RFC-0017 M2）——摘要与转换报告，不含格数据
      security: [{ OwnerToken: [] }]
      description: |
        导入：按 URL（provider 可缺省，按 host 归属分派）拉取云端快照，
        返回每表摘要（行列/已填/公式数/合并计数）与全部转换损失项，及
        snapshot_hash（execute 时远端须仍一致）。导出：读本地表格当前态，
        返回摘要与 source_version（execute 时本地版本须未变）。预检含
        blocked 项（如全簿公式超限）时返回 409 sheet_transfer_blocked，
        错误体携带全部报告项。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetTransferPreviewRequest" }
      responses:
        "200":
          description: 预览（摘要 + issues + 防偷换锚点）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SheetTransferPreview" }
        "400":
          description: 方向/链接不合法（bad_request / extdocs_bad_link）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 未知 provider / 文档不存在 / 目标不是表格
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 凭据未配置 / 需重新授权 / 预检阻止（sheet_transfer_blocked 时为 SheetTransferBlockedError，report 携报告项）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SheetTransferBlockedError" }
        "502":
          description: 上游失败（extdocs_upstream_error）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/extdocs/sheet-transfers:
    post:
      operationId: executeSheetTransfer
      summary: 执行表格副本交换（导入建本地新表 / 导出建云端新副本）
      security: [{ OwnerToken: [] }]
      description: |
        同步执行（有界）。导入：重拉快照比对 snapshot_hash（不符 = 409
        sheet_transfer_stale_preview）→ 创建本地表格资产并按修订批装配。
        导出：校验本地版本未变 → 建远端副本 → 回读校验。幂等键必填：同键
        重放返回既有记录（终态），不重复执行。执行前落 running 记录、终态
        回写；中断残留于启动时收敛为 unknown（历史可查）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetTransferExecuteRequest" }
      responses:
        "201":
          description: 交换记录（终态；report 携全部转换项）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SheetTransferRecord" }
        "400":
          description: 载荷不合法 / 缺幂等键
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: 未知 provider / 文档不存在 / 目标不是表格
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: 凭据未配置 / 需重新授权 / 预览过期（sheet_transfer_stale_preview）/ 预检阻止
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: 上游失败（extdocs_upstream_error；部分写入时记录保留目标链接）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listSheetTransfers
      summary: 表格交换历史（副本操作记录）
      parameters:
        - name: doc_id
          in: query
          schema: { type: string }
          description: 按本地文档过滤
        - name: direction
          in: query
          schema: { type: string, enum: [import, export] }
          description: 按方向过滤
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: 历史列表（created_at 倒序）
          content:
            application/json:
              schema:
                type: object
                required: [transfers]
                properties:
                  transfers:
                    type: array
                    items: { $ref: "#/components/schemas/SheetTransferRecord" }
        "404":
          description: 外部文档面未装配（extdocs_unavailable）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/extdocs/sheet-transfers/update/preview:
    post:
      operationId: previewSheetTransferUpdate
      summary: 回写预览（RFC-0017 M3）——目标与本地的差异摘要 + 目标哈希锚点
      security: [{ OwnerToken: [] }]
      description: |
        只做值域差异覆写（结构不动、远端多出格不清除）。结构不匹配（本地
        选中表在目标不存在）或差异超限 → 409 sheet_transfer_blocked 携报告。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetTransferUpdatePreviewRequest" }
      responses:
        "200":
          description: 差异摘要（每表 to_write/公式差异/远端多出）+ target_hash
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SheetTransferUpdatePreview" }
        "400": { description: 参数/归属不合法, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 文档不存在 / 非 / 未知 provider, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: 凭据 / 预检阻止（SheetTransferBlockedError）
          content: { application/json: { schema: { $ref: "#/components/schemas/SheetTransferBlockedError" } } }
        "502": { description: 上游失败, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/extdocs/sheet-transfers/update:
    post:
      operationId: executeSheetTransferUpdate
      summary: 执行回写（异步分块；202 返回后轮询单条记录）
      security: [{ OwnerToken: [] }]
      description: |
        预检（源版本 + 目标哈希 + 结构）通过即落 running 并转异步逐块覆写；
        块间检查点（cells_written）与取消生效。传输类失败 → unknown 停（不
        盲目续跑，人工 resume 收敛）；取消 → canceled/partial（已写保留）。
        幂等键同值重放返回既有记录。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SheetTransferUpdateExecuteRequest" }
      responses:
        "202":
          description: 已受理（记录 status=running；零差异直接终态）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SheetTransferRecord" }
        "400": { description: 载荷不合法, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "404": { description: 文档/provider 不存在, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: 凭据 / 预览过期（sheet_transfer_stale_preview）/ 预检阻止
          content: { application/json: { schema: { $ref: "#/components/schemas/SheetTransferBlockedError" } } }
        "502": { description: 上游失败, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/extdocs/sheet-transfers/by-id/{transfer_id}:
    get:
      operationId: getSheetTransfer
      summary: 单条交换记录（update 轮询进度用）
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SheetTransferRecord" }
        "404": { description: 记录不存在 / 未装配, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/extdocs/sheet-transfers/by-id/{transfer_id}/cancel:
    post:
      operationId: cancelSheetTransfer
      summary: 取消执行中的回写（块间生效；已写保留 → partial）
      security: [{ OwnerToken: [] }]
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 当前记录（已终态 = 幂等返回；长块仍在跑时 status 仍 running——前端继续轮询）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SheetTransferRecord" }
        "404": { description: 记录不存在, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 非 update 方向不可取消, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/extdocs/sheet-transfers/by-id/{transfer_id}/resume:
    post:
      operationId: resumeSheetTransfer
      summary: 续跑 partial/canceled/unknown 回写（校验未写区域仍等于前态）
      security: [{ OwnerToken: [] }]
      description: |
        校验失败（本地版本变 / 目标未写区域被第三方改动）→ 409 重新预览。
        无前态（超持久化上限）不可续跑。
      parameters:
        - name: transfer_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "202":
          description: 已续跑（status=running）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SheetTransferRecord" }
        "404": { description: 记录不存在, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409": { description: 不可续跑 / 目标被改（sheet_transfer_target_changed）/ 预览过期, content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /v1/owner/bootstrap:
    get:
      operationId: getOwnerBootstrap
      summary: 第一方客户端引导：返回 owner token（跨源门保护）
      description: |
        仅在配置了 OwnerToken 的装配上注册。响应含写端点所需的 X-Owner-Token 值。
        读取本身过跨源门：Origin 存在且非信任源（回环/壳源）→ 403——DNS rebinding
        页面同源化后也读不到 token（写通道另由 Origin 门 + token 双重把守）。
        无 Origin 的本机客户端（curl/同源 GET）可达——同用户本机进程本就等效 owner。
      responses:
        "200":
          description: token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        "403": { $ref: "#/components/responses/OriginRejected" }
        "404":
          description: 本装配未启用 owner token（owner_token_disabled）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /v1/harness/executables:
    get:
      operationId: listHarnessExecutables
      summary: 宿主扫描到的 agent CLI 注册表
      responses:
        "200":
          description: 注册表列表
          content:
            application/json:
              schema:
                type: object
                required: [executables]
                properties:
                  executables:
                    type: array
                    items:
                      $ref: "#/components/schemas/Executable"
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
    post:
      operationId: addHarnessExecutable
      summary: 手动登记 agent CLI（探测失败拒收）
      security: [{ OwnerToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualExecutableRequest"
      responses:
        "201":
          description: 已登记
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: registered }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
  /v1/harness/executables/{id}/enable:
    post:
      operationId: enableHarnessExecutable
      summary: 启用可执行项（登录门控；启用后 ≤10s 入座，无需重启）
      security: [{ OwnerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ExecutableID"
      responses:
        "200":
          description: 已启用
          content:
            application/json:
              schema:
                type: object
                required: [status, enabled]
                properties:
                  status: { type: string }
                  enabled: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: login_required（未登录不可启用）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
  /v1/harness/executables/{id}/disable:
    post:
      operationId: disableHarnessExecutable
      summary: 禁用可执行项（座位随 resync 撤出）
      security: [{ OwnerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ExecutableID"
      responses:
        "200":
          description: 已禁用
          content:
            application/json:
              schema:
                type: object
                required: [status, enabled]
                properties:
                  status: { type: string }
                  enabled: { type: boolean, const: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
  /v1/harness/executables/{id}:
    put:
      operationId: updateHarnessExecutable
      summary: 更新运行参数（模型覆盖与思考强度；v1.48）
      description: |
        全量替换语义：空串 = 清除覆盖，回 CLI 自身配置默认（尊重用户在 CLI 侧的
        既有选择）。模型名直接透传 CLI（codex/kimi 为 -m，mcode 为 --model
        provider/model）；思考强度仅 codex 有此面（-c model_reasoning_effort=，
        五档 minimal/low/medium/high/xhigh，实证 2026-09-03）。座位在下次
        resync（≤10s）生效，无须重启。
      security: [{ OwnerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ExecutableID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuntimeUpdateRequest"
      responses:
        "200":
          description: 已更新
          content:
            application/json:
              schema:
                type: object
                required: [status, model, reasoning_effort]
                properties:
                  status: { type: string }
                  model: { type: string }
                  reasoning_effort: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
  /v1/harness/executables/{id}/models:
    get:
      operationId: getHarnessExecutableModels
      summary: 模型候选与思考强度档位（v1.48）
      description: |
        kimi 经 CLI 实查（provider list --json——唯一支持动态模型列表的一家，
        实证 2026-09-03）；codex 返回五档思考强度与空模型候选（无官方列表命令，
        自由输入）；mcode 空面。查询失败不阻塞：dynamic 仍为 true，空候选+手输。
      parameters:
        - $ref: "#/components/parameters/ExecutableID"
      responses:
        "200":
          description: 候选面
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeOptions"
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
  /v1/harness/executables/{id}/update-check:
    get:
      operationId: getHarnessExecutableUpdateCheck
      summary: Agent CLI 版本检测（0.4.1——对照上游最新版）
      description: |
        npm 分发面家族（claude/codex/minimax）经登录 shell 实查 `npm view
        <pkg> version`（结果缓存 30 分钟；bash -lc 形态实证：绝对路径 npm 缺
        node、sh -lc 解析到 Windows 互操作 npm）。kimi/zcode 非 npm 分发：
        can_check=false，channel=manual，note 携手动更新指引。检测失败（网络
        瞬态）返回 200 + note 携原因（不缓存失败）。
      parameters:
        - $ref: "#/components/parameters/ExecutableID"
      responses:
        "200":
          description: 版本检测结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HarnessUpdateCheck"
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
  /v1/harness/executables/{id}/update:
    post:
      operationId: runHarnessExecutableUpdate
      summary: 启动 Agent CLI 更新任务（0.4.1；异步——过程经 SSE 可视化）
      description: |
        claude 走官方自更新子命令（`claude update`）；codex/minimax 走
        `npm install -g <pkg>@latest`（登录 shell 形态）；kimi 走 `kimi upgrade
        --yes`；zcode 无自动通道（409 no_update_channel）。异步受理即返 202
        （started=本次启动 / running=同实例任务在途幂等）；子进程输出逐行经
        GET .../update/stream SSE 转发；完成后版本重探并回填注册表。
      security: [{ OwnerToken: [] }]
      parameters:
        - $ref: "#/components/parameters/ExecutableID"
      responses:
        "202":
          description: 已受理（异步任务；过程经 update/stream SSE 可视化）
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [started, running] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: no_update_channel（该家族无自动更新通道）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
  /v1/harness/executables/{id}/update/stream:
    get:
      operationId: getHarnessExecutableUpdateStream
      summary: 更新任务过程日志 SSE（0.4.1 可视化）
      description: |
        连接即重放已积累行，随后实时逐行转发子进程输出（stdout/stderr 管道
        转发——npm 下载进度/自更新输出实时可见）；终态（done 携 new_version /
        failed 携 error）后关流；无任务发 idle 即关。只读观察面无写门（启动
        更新仍走 owner 门控的 POST）；15s 注释心跳防中间层缓冲。
      parameters:
        - $ref: "#/components/parameters/ExecutableID"
      responses:
        "200":
          description: 事件流（text/event-stream；data 为 {kind:line|done|failed|idle, line?, new_version?, error?} JSON）
          content:
            text/event-stream:
              schema: { type: string }
        "503": { $ref: "#/components/responses/HarnessUnavailable" }
components:
  securitySchemes:
    OwnerToken:
      type: apiKey
      in: header
      name: X-Owner-Token
      description: 写端点认证（M2）。第一方客户端经 GET /v1/owner/bootstrap（跨源门保护）获取。
  parameters:
    RoomID:
      name: room_id
      in: path
      required: true
      schema: { type: string, pattern: "^room_[0-9A-Za-z_-]+$" }
    DocID:
      name: doc_id
      in: path
      required: true
      schema: { type: string, pattern: "^doc_[0-9a-f]{12}$" }
    ExecutableID:
      name: id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
      description: 注册表唯一 ID（含路径，URL 编码传递）
  responses:
    BadRequest:
      description: 请求不合法（bad_request / invalid_command / bad_cursor / bad_limit / invalid_entry）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OriginRejected:
      description: 跨源拒绝（origin_rejected——本地 owner API）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 缺少或错误的 X-Owner-Token（owner_token_required）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: 版本冲突 / 幂等键指纹冲突（version_conflict / idempotency_conflict）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DocConflict:
      description: 版本冲突（version_conflict——含 current_version 与当前态 state，客户端在新态上重放本地未提交 ops，RFC-0014 §2.3）/ 幂等键指纹冲突（idempotency_conflict）/ 归档只读（doc_archived）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DocVersionConflict" }
    DocNotFound:
      description: 文档不存在（doc_not_found——未创建或已删除级联清除）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 房间或条目不存在（room_not_found / not_found）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooLarge:
      description: 请求体超过 1MiB（body_too_large）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnsupportedMediaType:
      description: Content-Type 须为 application/json（unsupported_media_type）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    HarnessUnavailable:
      description: 宿主注册表未配置（harness_unavailable）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Internal:
      description: 服务端错误（internal / snapshot_failed）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    RoomCommand:
      type: object
      required: [command_kind, expected_room_version, idempotency_key, issued_at, payload]
      additionalProperties: false
      description: |
        命令信封（RFC-0001）。payload 按 command_kind 严格校验（未知字段拒绝）：
        create_room → CreateRoomPayload；post_message → PostMessagePayload；
        pause_room → PauseRoomPayload；resume_room → 空 payload；
        rename_room → RenameRoomPayload（UI 重设计切片 1；room.renamed 事件）；
        endorse_intent → EndorseIntentPayload（OQ-17 人类保送，effect=grant）；
        invite_agent → {participant_id}（RFC-0001 Membership：participant.admitted 拉人）；
        fork/pause/resume/close/reopen/merge_thread → ThreadLifecyclePayload（RFC-0004 线程生命周期，
        状态机转移校验；merge 在个人版单 owner 形态下为直接命令=确认权）。
        attach_doc_to_room / detach_doc_from_room → {doc_id}（RFC-0014 §2.4 房间文档附着：
        关联事实进房间日志，附着不复制不锁定；attach 校验文档存在 + 上限 32，detach 免存在性
        ——文档已删也可解除；重复 attach / detach 未附着 = 幂等空操作，成功返回且不追加事件）。
      properties:
        command_kind:
          type: string
          enum: [create_room, post_message, pause_room, resume_room, rename_room, endorse_intent, invite_agent, fork_thread, pause_thread, resume_thread, close_thread, reopen_thread, merge_thread, propose_closure, accept_closure, create_evidence_request, claim_evidence_request, resolve_evidence_request, resolve_task, edit_memory, delete_room, run_task, cancel_run, attach_doc_to_room, detach_doc_from_room]
        expected_room_version:
          type: integer
          minimum: 0
        idempotency_key:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: UUIDv7（服务端按 tenant+key+kind 去重；同键异指纹 409）
        issued_at:
          type: string
          format: date-time
        payload:
          type: object
    CreateRoomPayload:
      type: object
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 120
        agents:
          type: array
          maxItems: 8
          description: 入房 Agent（participant ID，见 GET /v1/agents）。缺省/空 = 全部在席；非空 = 恰好所选（后续可 invite_agent 拉人）。
          items: { type: string, pattern: "^par_[0-9A-Za-z_-]+$" }
    RenameRoomPayload:
      type: object
      required: [display_name]
      additionalProperties: false
      description: 房间改名载荷（room.renamed 事件载荷同构）；改名不接受置空/纯空白。
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 120
    RoomList:
      type: object
      required: [rooms]
      properties:
        rooms:
          type: array
          items:
            $ref: "#/components/schemas/RoomSummary"
    RoomSummary:
      type: object
      required: [room_id, display_name, created_at, last_event_at, paused, message_count]
      properties:
        room_id: { type: string }
        display_name: { type: string, description: 最新 room.created/room.renamed 投影 }
        created_at: { type: string, format: date-time }
        last_event_at:
          type: string
          format: date-time
          description: 该房间最新事件时间（无事件则等于 created_at）；列表按此倒序
        paused: { type: boolean, description: 最新生命周期事件为 room.paused }
        message_count: { type: integer, format: int64, minimum: 0, description: message.posted 类事件数 }
        agents:
          type: array
          items: { type: string }
          description: roster 投影摘要（room.created.agents 物化快照 + participant.admitted 链；旧房间历史推导；缺省 = 旧版全席房间）——侧栏私聊/群聊分型依据（单元素即私聊房）
    PostMessagePayload:
      type: object
      required: [body]
      additionalProperties: false
      description: 字段集与 events/message.posted.schema.json 对齐（M2 定稿）；relations 项不收 provenance（系统固化 explicit）。
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 20000
        reply_to:
          oneOf:
            - type: "null"
            - type: string
              pattern: "^evt_[0-9A-Za-z_-]+$"
        addressed_to:
          type: array
          maxItems: 3
          items: { type: string, minLength: 1 }
        relations:
          type: array
          items:
            $ref: "#/components/schemas/TypedRelationInput"
        attachments:
          type: array
          maxItems: 4
          description: "RFC-0013 上传令牌（POST /v1/rooms/{id}/attachments 第一步产物）；服务端定稿为描述子嵌入事件——令牌不进事件载荷。"
          items: { type: string, pattern: "^upl_[0-9a-z_]+$" }
        refs:
          type: array
          maxItems: 8
          description: 文档引用（RFC-0014 §2.4）：分享文档到房间 = 发一条带 doc_ref 的消息（人类或 agent 均可）；服务端校验存在性（引用不存在/已删文档即拒）。缺省 = 无引用。
          items:
            $ref: "#/components/schemas/DocRef"
        external_refs:
          type: array
          maxItems: 4
          description: 外部文档引用（RFC-0016 §2.3，人类路径）：白名单 host 链接经 POST /v1/extdocs/resolve 定稿的描述子快照；服务端校验 kind→provider 归属与长度。缺省 = 无外部引用。
          items:
            $ref: "#/components/schemas/ExternalRef"
        thread_id:
          oneOf:
            - type: "null"
            - type: string
              pattern: "^thr_[0-9A-Za-z_-]+$"
    TypedRelationInput:
      type: object
      required: [target_event_id, kind]
      additionalProperties: false
      properties:
        target_event_id:
          type: string
          pattern: "^evt_[0-9A-Za-z_-]+$"
        kind:
          type: string
          enum: [supports, challenges, extends, questions, evidence_for, supersedes, analogy, relates]
    DocRef:
      type: object
      required: [kind, doc_id]
      additionalProperties: false
      description: 文档引用描述子（RFC-0014 §2.4 封闭字段集，与 room-protocol message.posted docRef 同形；anchor_block_id 锚定块级位置，卡片/编辑器据此定位）。
      properties:
        kind:
          type: string
          enum: [doc]
        doc_id:
          type: string
          pattern: "^doc_[0-9a-f]{12}$"
        anchor_block_id:
          type: string
          minLength: 1
    ExternalRef:
      type: object
      required: [kind, url]
      additionalProperties: false
      description: 外部文档引用描述子（RFC-0016 §2.3 封闭字段集，与 room-protocol message.posted externalRef 同形）：发送时刻定稿的链接事实，卡片不随外部服务刷新。host 白名单与 kind→provider 归属由服务端校验（schema 层只钉 https 前缀与长度）。
      properties:
        kind:
          type: string
          enum: [txdoc, fdoc]
        url:
          type: string
          pattern: "^https://[A-Za-z0-9.-]+/[A-Za-z0-9/_?&=%.\\-]*"
          maxLength: 512
        title:
          type: string
          maxLength: 200
        doc_type:
          type: string
          maxLength: 16
          description: "provider 侧推断的文档类型（txdoc：sheet/doc/slide/aio/form；fdoc：docx/doc/wiki/sheet/base/minutes/mind/slide/file；空 = 未知，卡片降级）"
    ExtDocSettingsDoc:
      type: object
      required: [provider, configured]
      additionalProperties: false
      description: provider 凭据状态（字段按 provider 分化；凭据值永不回传）。
      properties:
        provider: { type: string, enum: [tencent_docs, feishu_docs] }
        configured: { type: boolean, description: 凭据就绪可共享（tencent=有 token；feishu=应用+授权齐备） }
        app_configured: { type: boolean, description: "feishu：app_id/app_secret 已配置" }
        authorized: { type: boolean, description: "feishu：user_access_token 已授权" }
        expires_at:
          oneOf:
            - type: "null"
            - type: string
              format: date-time
          description: "feishu：access_token 到期时间"
        last_verified_at:
          oneOf:
            - type: "null"
            - type: string
              format: date-time
          description: 最近一次 verify 成功时间（从未 = null）
    ExtDocSettingsUpdate:
      type: object
      additionalProperties: false
      description: 凭据写入体（字段按 provider 分化；tencent 携 token、feishu 携 app_id+app_secret——两者须同时给；全部空 = 清除）。
      properties:
        token: { type: string, maxLength: 512, description: "tencent_docs：个人 MCP token（空串 = 清除）" }
        app_id: { type: string, maxLength: 128, description: "feishu_docs：自建应用 App ID" }
        app_secret: { type: string, maxLength: 256, description: "feishu_docs：自建应用 App Secret（空串 = 清除）" }
    ExtDocVerifyResult:
      type: object
      required: [ok]
      additionalProperties: false
      properties:
        ok: { type: boolean }
        upstream_code:
          type: string
          description: 上游错误码（ok=false 时存在，如腾讯 400006 token 无效 / 飞书 job_* 导入错误）
        message:
          type: string
          description: 人类可读摘要（不含凭据）
    ExtDocProviderView:
      type: object
      required: [provider, display_name, ref_kind, configured]
      additionalProperties: false
      properties:
        provider: { type: string, enum: [tencent_docs, feishu_docs] }
        display_name: { type: string }
        ref_kind: { type: string, description: external_refs.kind 值（txdoc | fdoc） }
        configured: { type: boolean }
        last_verified_at:
          oneOf:
            - type: "null"
            - type: string
              format: date-time
    ExtDocProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items: { $ref: "#/components/schemas/ExtDocProviderView" }
    ExtDocShare:
      type: object
      required: [doc_id, provider, external_url, shared_by, shared_at]
      additionalProperties: false
      description: 文档级共享映射（快照语义：映射记录创建时点，远端内容不回同步）。
      properties:
        doc_id: { type: string, pattern: "^doc_[0-9a-f]{12}$" }
        provider: { type: string, enum: [tencent_docs, feishu_docs] }
        external_url: { type: string, description: 远端文档 URL（创建结果） }
        shared_by: { type: string, description: 共享操作者（本地 owner） }
        shared_at: { type: string, format: date-time }
    ExtDocShareList:
      type: object
      required: [shares]
      properties:
        shares:
          type: array
          items: { $ref: "#/components/schemas/ExtDocShare" }
    ExtDocShareRequest:
      type: object
      required: [doc_id, provider]
      additionalProperties: false
      properties:
        doc_id: { type: string, pattern: "^doc_[0-9a-f]{12}$" }
        provider: { type: string, enum: [tencent_docs, feishu_docs] }
        force:
          type: boolean
          default: false
          description: true = 已有映射时重新创建并替换（旧远端文档保留）
    ExtDocLinkResolveRequest:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url:
          type: string
          maxLength: 512
          description: 待解析的外部文档链接（须白名单 host 的 https）
    ExtDocLinkInfo:
      type: object
      required: [url, provider, doc_type]
      additionalProperties: false
      description: 解析产物（ExternalRef 的构造材料）：title 尽力填充，失败为空串——卡片降级显示 URL。kind = 归属 provider 的 external_refs.kind。
      properties:
        url: { type: string }
        kind: { type: string, enum: [txdoc, fdoc], description: 归属 provider 的 ref kind }
        provider: { type: string, enum: [tencent_docs, feishu_docs] }
        title: { type: string, maxLength: 200 }
        doc_type: { type: string, maxLength: 16 }
    FeishuAuthorizeInfo:
      type: object
      required: [url, redirect_uri, scopes]
      additionalProperties: false
      description: 授权引导信息（redirect_uri 须与飞书后台安全设置登记值完全一致）。
      properties:
        url: { type: string, description: 授权页 URL（浏览器打开） }
        redirect_uri: { type: string, description: 须在飞书后台登记的重定向 URL }
        scopes: { type: array, items: { type: string }, description: 申请的权限 scope 清单 }
        auto_captured:
          type: boolean
          description: |
            true = 服务端已挂起回环回调监听，授权页跳转落回即自动完成绑定
            （设置页轮询状态即可）；false = 回调端口被占（如开发态 Vite），
            降级手动：从浏览器地址栏复制 code 提交 callback 端点。
    FeishuCallbackRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code: { type: string, maxLength: 512, description: "授权码（浏览器跳转地址栏 ?code= 的值；单次有效）" }
    SheetTransferPreviewRequest:
      type: object
      required: [direction]
      additionalProperties: false
      description: 预览请求。导入给 url（provider 可缺省，按 host 归属）；导出给 doc_id + provider。
      properties:
        direction: { type: string, enum: [import, export] }
        provider: { type: string, description: provider id（导入可缺省——按 URL host 分派） }
        url: { type: string, maxLength: 2048, description: 导入源（云端表格链接） }
        doc_id: { type: string, description: 导出源（本地表格 doc_id） }
        sheet_names:
          type: array
          items: { type: string, maxLength: 60 }
          maxItems: 20
          description: 可选工作表过滤（按名；空 = 全部）
    SheetTransferExecuteRequest:
      type: object
      required: [direction, idempotency_key]
      additionalProperties: false
      description: 执行请求。携预览返回的锚点（导入 snapshot_hash / 导出 source_version）防源偷换；缺锚点 = 跳过比对（信任当前态）。
      properties:
        direction: { type: string, enum: [import, export] }
        provider: { type: string }
        url: { type: string, maxLength: 2048 }
        doc_id: { type: string }
        sheet_names:
          type: array
          items: { type: string, maxLength: 60 }
          maxItems: 20
        snapshot_hash: { type: string, maxLength: 64, description: 导入：预览时的快照哈希（执行重拉须一致） }
        source_version: { type: integer, format: int64, minimum: 1, description: 导出：预览时的本地版本（执行时须未变） }
        idempotency_key: { type: string, minLength: 8, maxLength: 64, description: 幂等键（同键重放返回既有记录） }
    SheetTransferIssue:
      type: object
      required: [feature, severity, reason]
      additionalProperties: false
      description: 转换报告项（RFC-0017 §3.6——损失可定位，不静默降级）。
      properties:
        sheet: { type: string, description: 涉及工作表名 }
        range: { type: string, description: 涉及范围/坐标（展示用） }
        feature: { type: string, description: 特性名（如 超精度数值/布尔值/回读校验） }
        severity: { type: string, enum: [info, warning, blocked], description: info=注记 warning=有损可继续 blocked=阻止 }
        action: { type: string, enum: [kept, converted, dropped, truncated], description: 处理方式 }
        reason: { type: string, description: 原因与量化（如"N 格文本超限截断"） }
    SheetTransferPreviewSheet:
      type: object
      required: [name, rows, cols, filled, formulas]
      additionalProperties: false
      properties:
        name: { type: string }
        rows: { type: integer }
        cols: { type: integer }
        filled: { type: integer, description: 已填单元格数 }
        formulas: { type: integer, description: 公式格数 }
        merge_count: { type: integer, description: 合并区域数（不迁移，仅报告） }
    SheetTransferPreview:
      type: object
      required: [direction, provider, sheets, issues]
      additionalProperties: false
      properties:
        direction: { type: string, enum: [import, export] }
        provider: { type: string }
        title: { type: string, description: 文档标题 }
        source_url: { type: string, description: 导入源链接 }
        doc_id: { type: string, description: 导出源本地文档 }
        source_version: { type: integer, format: int64, description: 导出：预览基于的本地版本 }
        snapshot_hash: { type: string, description: 导入：预览基于的快照哈希 }
        sheets:
          type: array
          items: { $ref: "#/components/schemas/SheetTransferPreviewSheet" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/SheetTransferIssue" }
    SheetTransferRecord:
      type: object
      required: [transfer_id, idempotency_key, direction, provider, status, report, created_at, updated_at]
      additionalProperties: false
      description: 交换记录（终态或 unknown——中断残留）。
      properties:
        transfer_id: { type: string }
        idempotency_key: { type: string }
        direction: { type: string, enum: [import, export, update] }
        provider: { type: string }
        status:
          type: string
          enum: [running, succeeded, succeeded_with_warnings, failed, unknown, partial, canceled]
          description: import/export 同步执行（running 仅崩溃窗口）；update 异步分块（partial=已写部分未跑完，canceled=主动停，unknown=传输中断结果不确定）
        cells_total: { type: integer, description: update：差异格总数 }
        cells_written: { type: integer, description: update：已写格数（进度 = written/total） }
        doc_id: { type: string, description: 导入产物（本地新表格） }
        external_url: { type: string, description: 导出产物（云端新副本）/ 导入源 }
        title: { type: string }
        source_version: { type: integer, format: int64 }
        snapshot_hash: { type: string }
        report:
          type: array
          items: { $ref: "#/components/schemas/SheetTransferIssue" }
        error: { type: string, description: failed/unknown 时的原因 }
        created_at: { type: string }
        updated_at: { type: string }
    SheetTransferUpdatePreviewRequest:
      type: object
      required: [doc_id, provider, external_url]
      additionalProperties: false
      description: 回写预览（M3）：更新既有远端目标——目标取自历史导出记录的 external_url。
      properties:
        doc_id: { type: string, description: 本地表格 doc_id }
        provider: { type: string, description: provider id（须与目标链接归属一致） }
        external_url: { type: string, maxLength: 2048, description: 远端目标链接 }
        sheet_names:
          type: array
          items: { type: string, maxLength: 60 }
          maxItems: 20
          description: 可选工作表过滤（按名；空 = 全部）
    SheetTransferUpdateDiffSheet:
      type: object
      required: [name, to_write, formula_diffs, remote_extra]
      additionalProperties: false
      properties:
        name: { type: string }
        to_write: { type: integer, description: 将覆写的差异格数 }
        formula_diffs: { type: integer, description: 其中公式格数 }
        remote_extra: { type: integer, description: 远端多出格数（不清除，仅注记） }
    SheetTransferUpdateExecuteRequest:
      type: object
      required: [doc_id, provider, external_url, idempotency_key]
      additionalProperties: false
      description: 回写执行（异步）：携预览锚点（target_hash/source_version）防源与目标偷换。
      properties:
        doc_id: { type: string }
        provider: { type: string }
        external_url: { type: string, maxLength: 2048 }
        sheet_names:
          type: array
          items: { type: string, maxLength: 60 }
          maxItems: 20
        target_hash: { type: string, maxLength: 64, description: 预览时的目标快照哈希（执行重读须一致） }
        source_version: { type: integer, format: int64, minimum: 1, description: 预览时的本地版本（执行时须未变） }
        idempotency_key: { type: string, minLength: 8, maxLength: 64 }
    SheetTransferUpdatePreview:
      type: object
      required: [direction, provider, doc_id, external_url, source_version, target_hash, cells_total, diffs, issues]
      additionalProperties: false
      properties:
        direction: { type: string, enum: [update] }
        provider: { type: string }
        doc_id: { type: string }
        external_url: { type: string }
        title: { type: string }
        source_version: { type: integer, format: int64 }
        target_hash: { type: string }
        cells_total: { type: integer, description: 差异格总数（= 执行 cells_total） }
        diffs:
          type: array
          items: { $ref: "#/components/schemas/SheetTransferUpdateDiffSheet" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/SheetTransferIssue" }
    SheetTransferBlockedError:
      type: object
      required: [error, report]
      additionalProperties: false
      description: 预检阻止（sheet_transfer_blocked）——report 携全部转换项供逐项展示。
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        report:
          type: array
          items: { $ref: "#/components/schemas/SheetTransferIssue" }
    PauseRoomPayload:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 280
    ThreadLifecyclePayload:
      type: object
      additionalProperties: false
      description: 线程生命周期命令载荷（RFC-0004）。fork_thread 必填 source_event_id+goal；其余必填 thread_id；merge 另必填 merged_into。
      properties:
        thread_id: { type: string, pattern: "^thr_[0-9A-Za-z_-]+$" }
        source_event_id: { type: string, pattern: "^evt_[0-9A-Za-z_-]+$" }
        goal: { type: string, maxLength: 280 }
        participants: { type: array, items: { type: string } }
        merged_into: { type: string, pattern: "^thr_[0-9A-Za-z_-]+$" }
        reason: { type: string, maxLength: 280 }
    EndorseIntentPayload:
      type: object
      required: [intent_id, effect]
      additionalProperties: false
      description: 人类保送（RFC-0003 §3.1.11 / OQ-17）。effect=grant 直接授予 Floor（默认）；boost 未开放。不绕过预算/硬资格/安全；对全体可见。
      properties:
        intent_id:
          type: string
          pattern: "^int_[0-9A-Za-z_-]+$"
        effect:
          type: string
          enum: [grant]
    CommandResponse:
      type: object
      required: [room_id, event_id, room_version, replayed]
      properties:
        room_id: { type: string }
        event_id: { type: string }
        room_version: { type: integer, format: int64 }
        replayed: { type: boolean }
    DocCommand:
      type: object
      required: [command_kind, expected_doc_version, idempotency_key, issued_at, payload]
      additionalProperties: false
      description: |
        文档命令信封（RFC-0014 / ADR-0014：镜像房间命令纪律——幂等 + 文档级乐观并发）。
        payload 按 command_kind 严格校验（未知字段拒绝）：
        create_doc → {title, format?, initial_blocks?, anchor_message_id?}（仅 POST /v1/docs；
        format 缺省 markdown；spreadsheet 不接受 initial_blocks）；
        rename_doc → {title}；
        commit_doc_revision → {base_version?, ops[], note?}——ops 为一批块操作
        （insert_after/append 携带 block，replace 携带 text，delete 仅锚点 block_id；
        插入块的空 block_id 由服务端分配）；
        commit_sheet_revision → {base_version?, sheet_ops[], note?}（RFC-0017 M1，
        仅 format=spreadsheet；sheet_ops 为一批归一化表格操作——结构插删引发的
        公式改写由服务端定稿进事件）；
        archive_doc / restore_doc → 空 payload；
        delete_doc → {reason}（墓碑 + 内容级联清除，不可逆）；
        duplicate_doc → {title?}（缺省 = 原标题 + "（副本）"）。
      properties:
        command_kind:
          type: string
          enum: [create_doc, rename_doc, commit_doc_revision, commit_sheet_revision, archive_doc, restore_doc, delete_doc, duplicate_doc]
        expected_doc_version:
          type: integer
          minimum: 0
          description: 文档级乐观并发期望（create_doc 恒 0；duplicate_doc 为源文档版本断言）
        idempotency_key:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: UUIDv7（服务端按 tenant+key+kind 去重；同键异指纹 409）
        issued_at:
          type: string
          format: date-time
        payload:
          type: object
    DocCommandResponse:
      type: object
      required: [doc_id, event_id, doc_version, replayed]
      properties:
        doc_id: { type: string }
        event_id: { type: string }
        doc_version: { type: integer, format: int64 }
        replayed: { type: boolean }
    DocVersionConflict:
      type: object
      required: [error]
      description: 409 响应体：error 恒在；version_conflict 时另含 doc_id/current_version/state（当前态摘要——RFC-0014 §2.3 客户端在新态上重放未提交 ops）。
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [version_conflict, idempotency_conflict, doc_archived]
            message: { type: string }
        doc_id: { type: string }
        current_version: { type: integer, format: int64 }
        state:
          $ref: "#/components/schemas/DocState"
    DocList:
      type: object
      required: [docs]
      properties:
        docs:
          type: array
          items:
            $ref: "#/components/schemas/DocSummary"
    DocSummary:
      type: object
      required: [doc_id, title, format, version, status, created_by, created_at, updated_by, updated_at]
      description: 文档主页行（RFC-0014 §2.8：updated_at 倒序；format 供列表行分派图标/入口，RFC-0017）。
      properties:
        doc_id: { type: string }
        title: { type: string, description: 最新 doc.created/doc.renamed 投影 }
        format: { type: string, enum: [markdown, spreadsheet] }
        version: { type: integer, format: int64 }
        status: { type: string, enum: [active, archived] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_by: { type: string, description: 最新事件的 actor（人或 agent） }
        updated_at: { type: string, format: date-time }
    DocBlock:
      type: object
      required: [block_id, type, text]
      description: 块模型（RFC-0014 §2.2；RFC-0016 增补元数据）：level 仅 heading（1..6，缺省导出按 2）、lang 仅 code（≤48 runes）；text 自带标记（# 前缀/fence）导出透传优先——存量数据零迁移。
      properties:
        block_id: { type: string, description: 稳定块 ID（锚定操作/冲突重放/卡片摘要的基础） }
        type: { type: string, enum: [heading, paragraph, list, code, quote, hr] }
        text: { type: string, description: markdown 行内内容 }
        level: { type: integer, minimum: 1, maximum: 6, description: heading 专属：标题级别 }
        lang: { type: string, maxLength: 48, description: code 专属：语言标注（如 go、python） }
    DocState:
      type: object
      required: [doc_id, title, format, created_by, created_at, version, status, updated_at, updated_by]
      description: |
        文档当前态（派生态，权威为 per-doc 事件流；GET /v1/docs/{doc_id} 快照）。
        format 分派（RFC-0017 §3.2）：markdown → blocks；spreadsheet → sheets
        （工作表元信息清单；单元格内容经 /sheets/{sheet_id}/range 有界读取，
        不在快照里整簿下发）。
      properties:
        doc_id: { type: string }
        title: { type: string }
        format: { type: string, enum: [markdown, spreadsheet] }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        version: { type: integer, format: int64 }
        status: { type: string, enum: [active, archived] }
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/DocBlock"
          description: format=markdown 携带；spreadsheet 缺省
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/SheetMeta"
          description: format=spreadsheet 携带；markdown 缺省
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
    SheetMeta:
      type: object
      required: [sheet_id, name, rows, cols, filled_cells]
      description: 工作表元信息（RFC-0017 §3.2；行列尺寸为显式布局意图，filled = 值或公式非空格数）。
      properties:
        sheet_id: { type: string }
        name: { type: string }
        rows: { type: integer, minimum: 1, maximum: 5000 }
        cols: { type: integer, minimum: 1, maximum: 200 }
        filled_cells: { type: integer, minimum: 0 }
    SheetOp:
      type: object
      required: [op]
      additionalProperties: false
      description: |
        单条表格操作（扁平联合，与 room-protocol doc.sheet_revision_committed 的
        $defs.sheetOp 同形）。服务端归一化后定稿进事件（add_sheet 回填分配 ID、
        结构插删连带公式改写）。容量护栏：≤64 ops / 256 KiB / 单批 ≤1000 cells。
      properties:
        op:
          type: string
          enum: [set_cells, clear_range, set_style, add_sheet, rename_sheet, delete_sheet, insert_rows, delete_rows, insert_columns, delete_columns, set_col_width, set_row_height]
        sheet_id: { type: string, pattern: "^sht_[0-9A-Za-z_-]+$" }
        name: { type: string, minLength: 1, maxLength: 60 }
        cells:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/SheetCellWrite"
        range: { $ref: "#/components/schemas/SheetRange" }
        keep_style: { type: boolean }
        style: { $ref: "#/components/schemas/SheetCellStyle" }
        at: { type: integer, minimum: 1 }
        count: { type: integer, minimum: 1, maximum: 1000 }
        col: { type: integer, minimum: 1, maximum: 200 }
        row: { type: integer, minimum: 1, maximum: 5000 }
        width: { type: integer, minimum: 40, maximum: 600 }
        height: { type: integer, minimum: 20, maximum: 200 }
    SheetCellWrite:
      type: object
      required: [r, c, type]
      additionalProperties: false
      description: 单元格写入（类型-字段严格配对；style 缺省保留既有）。
      properties:
        r: { type: integer, minimum: 1, maximum: 5000 }
        c: { type: integer, minimum: 1, maximum: 200 }
        type: { type: string, enum: [text, number, bool, datetime, formula, null] }
        text: { type: string, maxLength: 8192 }
        number: { type: number }
        bool: { type: boolean }
        formula: { type: string, minLength: 1, maxLength: 512 }
        style: { $ref: "#/components/schemas/SheetCellStyle" }
    SheetCellStyle:
      type: object
      additionalProperties: false
      description: 基础样式（指针语义：仅给出的字段被改写）。
      properties:
        bold: { type: boolean }
        italic: { type: boolean }
    SheetRange:
      type: object
      required: [r1, c1, r2, c2]
      additionalProperties: false
      description: 矩形范围（闭区间）。
      properties:
        r1: { type: integer, minimum: 1, maximum: 5000 }
        c1: { type: integer, minimum: 1, maximum: 200 }
        r2: { type: integer, minimum: 1, maximum: 5000 }
        c2: { type: integer, minimum: 1, maximum: 200 }
    SheetCellView:
      type: object
      required: [r, c, type]
      description: 范围读取的单格视图（公式格同时携带原文与派生结果）。
      properties:
        r: { type: integer }
        c: { type: integer }
        type: { type: string, enum: [text, number, bool, datetime, formula] }
        text: { type: string }
        number: { type: number }
        bool: { type: boolean }
        formula: { type: string }
        style: { $ref: "#/components/schemas/SheetCellStyle" }
        derived:
          type: object
          required: [kind]
          description: 公式派生结果（kind = value | error | unsupported）。
          properties:
            kind: { type: string, enum: [value, error, unsupported] }
            value: { $ref: "#/components/schemas/SheetCellValueOut" }
            err: { type: string }
    SheetCellValueOut:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [text, number, bool, datetime] }
        text: { type: string }
        number: { type: number }
        bool: { type: boolean }
    SheetRangeView:
      type: object
      required: [doc_id, sheet_id, version, range, cells, truncated]
      description: 范围读取结果（Truncated = used-range 缺省读取被 10000 格上限按行截断）。
      properties:
        doc_id: { type: string }
        sheet_id: { type: string }
        version: { type: integer, format: int64 }
        range: { $ref: "#/components/schemas/SheetRange" }
        cells:
          type: array
          items:
            $ref: "#/components/schemas/SheetCellView"
        truncated: { type: boolean }
    DocEventView:
      type: object
      required: [event_id, doc_id, type, schema_version, occurred_at, actor, payload, position]
      description: 文档事件对外视图（同房间 EventView 纪律：无 tenant_id/version，opaque position 替代；position = doc version 游标）。
      properties:
        event_id: { type: string }
        doc_id: { type: string }
        type: { type: string }
        schema_version: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor:
          type: object
          required: [participant_id, kind]
          properties:
            participant_id: { type: string }
            kind: { type: string, enum: [human, agent, system] }
        causation_id:
          oneOf:
            - type: "null"
            - type: string
        correlation_id:
          oneOf:
            - type: "null"
            - type: string
        payload:
          type: object
        position:
          type: string
          description: opaque cursor（续传位点，= doc version）
    DocSearchHit:
      type: object
      required: [doc_id, event_id, version, actor, title, body, occurred_at]
      description: 文档检索命中（每文档取最新命中版本；version 供编辑器/卡片跳转定位）。
      properties:
        doc_id: { type: string }
        event_id: { type: string }
        version: { type: integer, format: int64 }
        actor: { type: string }
        title: { type: string }
        body: { type: string, description: 命中文本（索引行全文，客户端自行截断展示） }
        occurred_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: 稳定错误码（transport 与 domain 映射）
            message: { type: string }
    EventView:
      type: object
      required: [event_id, room_id, type, schema_version, occurred_at, actor, visibility, payload, position]
      description: 对外事件视图（RFC-0001 P0：无 seq/tenant_id，opaque position 替代）；payload 的事件族 Schema 见 api/room-protocol/events/。
      properties:
        event_id: { type: string }
        room_id: { type: string }
        thread_id:
          oneOf:
            - type: "null"
            - type: string
        type: { type: string }
        schema_version: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor:
          type: object
          required: [participant_id, kind]
          properties:
            participant_id: { type: string }
            kind: { type: string, enum: [human, agent, system] }
        causation_id:
          oneOf:
            - type: "null"
            - type: string
        correlation_id:
          oneOf:
            - type: "null"
            - type: string
        visibility:
          type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [public, participants, moderators, system] }
            participants:
              type: array
              items: { type: string }
        payload:
          type: object
        position:
          type: string
          description: opaque cursor（续传位点）
    Snapshot:
      type: object
      required: [room_id, room_version, watermark, projection_version, algorithm_version, display_name, timeline, scorecard, threads, graph, participants, docs]
      properties:
        room_id: { type: string }
        room_version: { type: integer, format: int64 }
        watermark: { type: string }
        projection_version: { type: integer, format: int64 }
        algorithm_version: { type: integer, format: int64 }
        display_name: { type: string, description: 房间名（room.created/room.renamed 投影产物） }
        participants:
          type: array
          description: 参与者视图（装配层注入：本地 owner + 引擎座位；非投影产物——ADR-0011 注记，不进 room_version/水位语义）。
          items:
            $ref: "#/components/schemas/ParticipantView"
        roster:
          type: array
          description: 房间成员投影（room.created.agents + participant.admitted 链；null/缺 = 全部在席）。
          items: { type: string }
        threads:
          type: array
          description: 线程投影（RFC-0004 生命周期状态 + fork 谱系 + 合并去向）。
          items:
            type: object
            required: [thread_id, state]
            properties:
              thread_id: { type: string }
              state: { type: string, enum: [active, paused, closed, merged] }
              parent: { type: string }
              goal: { type: string }
              merged_into: { type: string }
              message_count: { type: integer }
        graph:
          type: array
          description: 显式关系边（forked_from/responds_to/merged_into + relations 类型化边）。推断边属结构投影（M3），接入后标 inferred=true——双视图显式与推断区分。
          items:
            type: object
            required: [kind, from, to, inferred]
            properties:
              kind: { type: string }
              from: { type: string }
              to: { type: string }
              inferred: { type: boolean }
        scorecard:
          type: array
          description: 记分卡（R-08/OQ-17：intent 全量投影，band + 未选理由 + 保送状态）。
          items:
            type: object
            required: [intent_id, participant_id, score_band, selected, endorsed]
            properties:
              intent_id: { type: string }
              participant_id: { type: string }
              type: { type: string }
              action: { type: string }
              score_band: { type: string }
              selected: { type: boolean }
              endorsed: { type: boolean }
              public_rationale: { type: string }
              unselected_reason: { type: string }
              round_id: { type: string }
              occurred_at: { type: string, format: date-time }
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TimelineItem"
        closures:
          type: array
          description: 收束清单（M3-2：pending 可接受 / accepted / rejected 各一条摘要）。
          items:
            $ref: "#/components/schemas/ClosureSummary"
        tasks:
          type: array
          description: 任务清单（M3-3 tasklist，RFC-0012 OQ-A：带责任人 owner 的承诺追踪——确定性派生 + 人工门控裁定）。
          items:
            $ref: "#/components/schemas/TaskItem"
        runs:
          type: array
          description: 任务执行通道（M4-1，RFC-0002 执行生命周期补编）：独立于群聊波的长任务执行与结果回传。
          items:
            $ref: "#/components/schemas/RunView"
        docs:
          type: array
          description: 房间附着文档段（RFC-0014 §2.4：doc.attached_to_room/doc.detached_from_room 折叠——房间右面板"文档"段数据源；投影产物，随事件全量重建；附着不复制、不锁定，同一文档可附着多个房间）。
          items:
            $ref: "#/components/schemas/AttachedDoc"
        evidence_requests:
          type: array
          description: 证据需求单（M3-5：open/resolved/dismissed）。
          items:
            $ref: "#/components/schemas/EvidenceRequestView"
        dev_notes:
          type: array
          description: 开发者模式回放条目（M3-1 持久化补全：事件支撑的 [dev] 内联信息，重启还原）。
          items:
            $ref: "#/components/schemas/DevNote"
    DevNote:
      type: object
      required: [position, event_id, type, occurred_at, payload]
      properties:
        position: { type: string }
        event_id: { type: string }
        type: { type: string }
        occurred_at: { type: string, format: date-time }
        payload: { type: object }
    EvidenceRequestView:
      type: object
      required: [request_id, question, status]
      properties:
        request_id: { type: string }
        claim_id: { type: string }
        question: { type: string }
        required_evidence: { type: array, items: { type: string } }
        acceptance_criteria: { type: string }
        owners: { type: array, items: { type: string } }
        status: { type: string, enum: [open, resolved, dismissed] }
        evidence_refs: { type: array, items: { type: string } }
        reopen_thread_on_resolution: { type: boolean }
    ClosureSummary:
      type: object
      required: [closure_id, thread_id, state, ready, evaluated, concluded, objected]
      properties:
        closure_id: { type: string }
        thread_id: { type: string }
        state: { type: string, enum: [pending, rejected, accepted] }
        closure_type: { type: string, enum: [consensus, bounded_disagreement] }
        ready: { type: boolean }
        evaluated: { type: integer }
        concluded: { type: integer }
        objected: { type: integer }
        reason: { type: string }
    ParticipantView:
      type: object
      required: [participant_id, kind, display_name, seat_status]
      properties:
        participant_id: { type: string }
        kind: { type: string, enum: [human, agent, system] }
        display_name: { type: string, description: 引擎已知名字（Owner/Echo/Codex/Kimi 等） }
        adapter: { type: string, description: agent 座位的适配器名（human 无此键） }
        channel: { type: string, description: harness 渠道标签（cli/app:codex-desktop 等；无则省略） }
        seat_status: { type: string, description: seated（在座；离座语义随 UI 重设计后续切片定稿） }
    AttachmentUploadMeta:
      type: object
      required: [token, name, mime, size_bytes, sha256]
      properties:
        token: { type: string, description: "上传令牌（upl_*；24h 有效、单次消费）" }
        name: { type: string, description: 净化后的文件名（basename 化、控制字符剔除、≤200 字） }
        mime: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        sha256: { type: string }
    AttachmentDescriptor:
      type: object
      required: [attachment_id, name, mime, size_bytes, storage_path, sha256]
      description: message.posted 载荷与快照 Timeline 中的附件描述子（RFC-0013 §2.1 封闭字段集）。
      properties:
        attachment_id: { type: string, pattern: "^att_[0-9a-z_]+$" }
        name: { type: string }
        mime: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 0 }
        storage_path: { type: string, description: 相对数据目录的存储路径 }
        sha256: { type: string }
    RunView:
      type: object
      required: [run_id, assignee, instruction, requester, status, requested_at, updated_at]
      description: "任务执行视图（M4-1）：status ∈ requested | running | completed | failed | canceled | unknown；迟到审计（late）不改终态。"
      properties:
        run_id: { type: string, pattern: "^run_[0-9A-Za-z_-]+$" }
        task_id: { type: string, description: 可选关联的 tasklist 项 }
        assignee: { type: string, description: 负责人（agent 座位） }
        instruction: { type: string }
        requester: { type: string, description: 提出方（人类） }
        status: { type: string, enum: [requested, running, completed, failed, canceled, unknown] }
        error: { type: string }
        result_event_id: { type: string, description: 结果消息事件（message.posted） }
        late: { type: boolean, description: 迟到结果审计标记（取消后/暂停期到达——不发布正文） }
        result_body: { type: string, description: 迟到审计保留的执行结果正文（late 时唯一留存——未发布，供人类查看/复制救济） }
        requested_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AttachedDoc:
      type: object
      required: [doc_id, attached_by, attached_at]
      description: 房间附着文档投影项（RFC-0014 §2.4；重复附着以最新事实覆盖 attached_by/attached_at，detach 出集）。
      properties:
        doc_id: { type: string, pattern: "^doc_[0-9a-f]{12}$" }
        attached_by: { type: string, description: 附着操作者（participant ID） }
        attached_at: { type: string, format: date-time }
    SettingsDoc:
      type: object
      required: [run_timeout_seconds]
      additionalProperties: false
      description: "设置族文档（OQ-B，M4-1 首员 + M4-3 第二员 + 附录 K 发言资格闸）：全量替换语义；新成员迁入时向后兼容（缺字段 = 缺省）。"
      properties:
        run_timeout_seconds:
          type: integer
          minimum: 60
          maximum: 7200
          description: 独立任务执行时长上限（秒；缺省 600；长于单轮 180s——"长任务"服务面）
        reply_or_pass_mode:
          type: string
          enum: [auto, off]
          description: "单次 reply-or-pass 限定路径（M4-3）：auto（缺省）= 资格座位走单次路径；off = 回退两阶段（A/B 控制组）"
        speak_gate_off:
          type: boolean
          description: "发言资格闸关闭开关（RFC-0012 附录 K）：false（缺省）= 闸开（speak 意图须过资格分阈值，@点名/定向豁免）；true = 关闸（意愿即放行）"
        speak_gate_threshold:
          type: number
          minimum: 0.05
          maximum: 0.95
          description: "发言资格分阈值（缺省 0.30；资格分 = relevance×0.6 + urgency×0.4，低于阈值被闸并留痕）"
        speak_gate_cooldown_penalty:
          type: number
          minimum: 0.05
          maximum: 0.9
          description: "上波发言者的资格分扣减（缺省 0.20，可调 0.05..0.90——软冷却；@点名豁免不受限）"
    MonitorState:
      type: object
      description: "监控运行态（M4-5）：三水位（观察/处理/送达）与失败分类分开——源失败不动水位、处理失败可重试、no-change 去重计数。"
      properties:
        monitor_id: { type: string }
        last_observed: { type: string, description: 观察水位（最近成功快照哈希） }
        last_processed: { type: string, description: 处理水位（最近交给 run 的哈希） }
        last_delivered: { type: string, description: 送达水位（结果已回房的哈希） }
        in_flight_run: { type: string, description: 在途 run（run.requested 事件引用） }
        pending_hash: { type: string, description: 待处理水位（在途期间到达的新变化——完成后接力） }
        last_error: { type: string, description: 源失败（取快照失败；恢复即清） }
        process_error: { type: string, description: 处理/投递失败（重试路径） }
        no_change_count: { type: integer, format: int64, description: 连续无变化次数（模型调用去重证据） }
        last_checked_at: { type: string, format: date-time }
        last_delivered_at: { type: string, format: date-time }
    MonitorView:
      type: object
      required: [monitor_id, kind, target, room_id, assignee, interval_sec, enabled, state]
      description: "监控源 + 运行态合并视图（M4-5）。"
      properties:
        monitor_id: { type: string, pattern: "^mon_[0-9A-Za-z_-]+$" }
        kind: { type: string, enum: [script, url] }
        target: { type: string, description: 脚本绝对路径（无 shell）或 URL }
        args: { type: array, items: { type: string } }
        room_id: { type: string, description: 结果投递房间 }
        assignee: { type: string, description: 受指派 Agent（稳定身份 par_*） }
        interval_sec: { type: integer, minimum: 10, maximum: 86400 }
        instruction: { type: string, description: "指令模板（空 = 缺省；{{monitor}}/{{diff}} 占位）" }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/MonitorState" }
    MonitorCreate:
      type: object
      required: [kind, target, room_id, assignee, interval_sec]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [script, url] }
        target: { type: string }
        args: { type: array, items: { type: string } }
        room_id: { type: string }
        assignee: { type: string }
        interval_sec: { type: integer, minimum: 10, maximum: 86400 }
        instruction: { type: string }
        enabled: { type: boolean }
    BackupSummary:
      type: object
      required: [backup_id, created_at, size_bytes]
      properties:
        backup_id: { type: string, description: "bkp_<ts36>_<hex>（本包生成，白名单字符）" }
        created_at: { type: string, format: date-time }
        size_bytes: { type: integer, format: int64, minimum: 0 }
    TimelineItem:
      type: object
      required: [position, event_id, type, actor_id, actor_kind, occurred_at]
      description: |
        RFC-0012 群聊模型：Timeline = 消息族 + 暂停/恢复系统提醒（round.* 内部化，
        不入用户可见时间线）。
      properties:
        position: { type: string }
        event_id: { type: string }
        type: { type: string }
        actor_id: { type: string }
        actor_kind: { type: string }
        body: { type: string }
        addressed_to:
          type: array
          description: 消息点名的参与者（message.posted 载荷同名字段；M4-0 快照/SSE 两路同形）。
          items: { type: string }
        reply_to:
          oneOf:
            - type: "null"
            - type: string
              pattern: "^evt_[0-9A-Za-z_-]+$"
          description: 引用回复的目标事件（M4-0 聊天交互补齐）。
        attachments:
          type: array
          description: 消息附件描述子（RFC-0013；缺省 = 无附件）。
          items: { $ref: "#/components/schemas/AttachmentDescriptor" }
        refs:
          type: array
          description: 文档引用（RFC-0014 §2.4；缺省 = 无引用；快照/SSE 两路同形——同 attachments 纪律）。
          items: { $ref: "#/components/schemas/DocRef" }
        external_refs:
          type: array
          description: 外部文档引用（RFC-0016 §2.3；缺省 = 无；快照/SSE 两路同形——同 refs 纪律）。发送时刻的描述子快照，不随外部服务刷新。
          items: { $ref: "#/components/schemas/ExternalRef" }
        thread_id:
          oneOf:
            - type: "null"
            - type: string
        occurred_at: { type: string, format: date-time }
    Executable:
      type: object
      required: [id, adapter, runtime, path, enabled]
      properties:
        id: { type: string, description: 注册表唯一 ID（adapter@runtime:path） }
        adapter: { type: string }
        runtime: { type: string, description: native | wsl }
        distro: { type: string, description: WSL 运行面的发行版（native 为空） }
        path: { type: string }
        version: { type: string }
        digest: { type: string, description: sha256（版本固定门禁用） }
        login_state: { type: string, description: logged_in | logged_out | unknown }
        source: { type: string, description: auto_scan | manual }
        channel: { type: string, description: 实例渠道（ADR-0012）：cli | app:codex-desktop | app:kimi-work | app:zcode-desktop }
        bundle: { type: string, description: 桌面渠道内嵌 agent bundle 绝对路径（app:zcode-desktop 实例非空；空 = 纯 CLI 实例） }
        priority: { type: integer, description: 家族裁定优先级（数值小者优先；列表已按 adapter→priority→path 排序） }
        discovered_at: { type: string, format: date-time }
        enabled: { type: boolean }
        eval_model: { type: string, description: 评估任务专用模型（手编；空 = 与生成同模型） }
        model: { type: string, description: 模型覆盖（v1.48；空 = CLI 自身配置默认） }
        reasoning_effort: { type: string, description: 思考强度（v1.48；仅 codex 有此面；空 = CLI 默认） }
    ManualExecutableRequest:
      type: object
      required: [adapter, runtime, path]
      additionalProperties: false
      properties:
        adapter: { type: string }
        runtime: { type: string }
        distro: { type: string }
        path: { type: string }
        version: { type: string }
        channel: { type: string, description: 可选渠道覆盖（cli 或 app:<小写>），空值按 cli }
        bundle: { type: string, description: 可选内嵌 bundle 路径覆盖（zcode 桌面形态非约定布局时的逃生口；空值按 exe 同级约定布局推断） }
    RuntimeUpdateRequest:
      type: object
      required: [model, reasoning_effort]
      additionalProperties: false
      description: 运行参数更新体（全量替换；空串 = 清除覆盖回 CLI 默认）。
      properties:
        model: { type: string, maxLength: 120, description: "模型覆盖（codex/kimi 走 -m；mcode 走 --model provider/model）" }
        reasoning_effort: { type: string, enum: ["", minimal, low, medium, high, xhigh], description: "思考强度（仅 codex；空 = CLI 默认）" }
    RuntimeOptions:
      type: object
      required: [models, dynamic, effort_levels]
      description: 模型候选与思考强度档位（设置页下拉数据源）+ 确定量默认值（v1.49）。
      properties:
        models:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string, description: 传给 CLI 的模型名（kimi 为 alias） }
              display_name: { type: string }
        dynamic: { type: boolean, description: true = CLI 实查候选（kimi）；false = 无官方列表命令（空候选+自由输入） }
        effort_levels: { type: array, items: { type: string }, description: 思考强度档位（仅 codex 非空） }
        default_model: { type: string, description: "不覆盖时的 CLI 默认模型（配置文件值优先；空 = CLI 内置预设未公布）" }
        default_effort: { type: string, description: "不覆盖时的 CLI 默认思考强度（codex 官方默认 medium）" }
        default_source: { type: string, enum: [config, builtin, ""], description: "默认值来源——config=CLI 配置文件；builtin=官方文档/出厂回退" }
    HarnessUpdateCheck:
      type: object
      required: [adapter, current_version, up_to_date, comparable, can_check, can_update, channel, checked_at]
      description: Agent CLI 版本检测（0.4.1）：注册表探测版本对照上游最新版（按 ADR-0016 三通道分派检测面——registry/self-update 经仓库客户端（npm view）；mosaic 对齐自建 releases 信号（产品更新源 feed 优先、源码 tag 回退）；均缓存 30 分钟）。
      properties:
        adapter: { type: string }
        current_version: { type: string, description: 注册表探测原文（如 "2.1.172 (Claude Code)"） }
        current_semver: { type: string, description: 原文中解析出的 x.y.z（解析不出为空） }
        latest: { type: string, description: 上游最新版（npm 版本 / 源码最新 semver tag；检测失败为空） }
        up_to_date: { type: boolean, description: "comparable 时为语义化比较结果；不可比（版本方案不同）或无检测面恒 true——不标红" }
        comparable: { type: boolean, description: "版本方案可比（两侧 semver 同 major 系——zcode 实录：安装侧 0.16.9 桌面内核版方案 vs 上游 3.x，跨系比对必恒误报）" }
        can_check: { type: boolean, description: 有检测面（npm 分发 / 源码 tag） }
        can_update: { type: boolean, description: 有自动更新通道（npm / 官方自更新） }
        channel: { type: string, enum: [registry, self-update, mosaic], description: "更新通道三分类（ADR-0016）：registry=第三方分发仓库（现役 npm）；self-update=官方自更新子命令（检测可借仓库面）；mosaic=Mosaic 自带通道（自建打包脚本 ~/.mosaic/update/<adapter>.sh，检测对齐自建 releases 信号）" }
        note: { type: string, description: "manual 指引 / 不可比说明 / 检测失败原因" }
        checked_at: { type: string, format: date-time }
    HarnessUpdateRun:
      type: object
      required: [status, new_version]
      description: 更新执行结果（0.4.1）：完成后重探版本并回填注册表。
      properties:
        status: { type: string, const: ok }
        new_version: { type: string, description: 更新后实测版本（--version 重探） }
        output_tail: { type: string, description: 更新命令输出尾（排障可见） }
    TaskItem:
      type: object
      required: [task_id, owner, requester, text, source_event_id, declared_at, declared_seq, waves_since, overdue, status]
      description: 任务清单项（M3-3 tasklist）：显式申报协议派生（mosaic-todo 围栏块，可带 @负责人 指派）+ 人工门控裁定（task.resolved）。
      properties:
        task_id: { type: string, description: "tsk_ 前缀（源事件+负责人+文本哈希派生，确定性）" }
        owner: { type: string, description: 负责人（被指派/自领的 agent participant_id） }
        requester: { type: string, description: "提出方（申报人；A 指派 B 时 requester=A、owner=B，自领两者相同）" }
        text: { type: string, description: "申报事项文本（mosaic-todo 行，归一化后截断 120 字）" }
        source_event_id: { type: string, description: 首次申报消息（provenance 跳转位） }
        declared_at: { type: string, format: date-time }
        declared_seq: { type: integer, format: int64 }
        waves_since: { type: integer, description: 申报后经过的波数 }
        overdue: { type: boolean, description: pending 且 waves_since ≥ 2 }
        status: { type: string, enum: [pending, delivered, dismissed] }
        resolution: { type: string }
        note: { type: string }
        resolved_by: { type: string }
        resolved_at: { type: string, format: date-time }
    ResolveTaskPayload:
      type: object
      required: [task_id, resolution]
      additionalProperties: false
      description: 任务裁定（task.resolved 事件载荷）：delivered=已交付；dismissed=误报/撤销。
      properties:
        task_id: { type: string, pattern: "^tsk_[0-9A-Za-z_-]+$" }
        resolution: { type: string, enum: [delivered, dismissed] }
        note: { type: string, maxLength: 280 }
    EditMemoryPayload:
      type: object
      required: [memory_id]
      additionalProperties: false
      description: 胶囊记忆人工编辑（memory.edited 事件载荷）：conclusions/assumptions 为编辑后全文（整组替换），至少一项提供。
      properties:
        memory_id: { type: string, description: "胶囊 closure_id（clo_*）或策展条目 ID（mem_*）" }
        conclusions: { type: array, maxItems: 12, items: { type: string, maxLength: 500 } }
        assumptions: { type: array, maxItems: 12, items: { type: string, maxLength: 500 } }
        note: { type: string, maxLength: 280, description: 编辑理由（留痕） }
        curated_content: { type: string, maxLength: 200, description: "策展条目编辑后全文（memory_id=mem_* 时必填，整条替换）" }
    MemoryView:
      type: object
      required: [room_id, capsules, capsule_budget, curated, curated_budget]
      description: 记忆查看面（GET /v1/rooms/{id}/memory）：编辑后胶囊 + 策展条目 + 容量水位。
      properties:
        room_id: { type: string }
        capsules:
          type: array
          items:
            type: object
            required: [closure_id, closure_type, thread_id, conclusions, assumptions, named_dissent, edit_history]
            properties:
              closure_id: { type: string }
              closure_type: { type: string, enum: [consensus, bounded_disagreement] }
              thread_id: { type: string }
              watermark: { type: integer, format: int64 }
              conclusions: { type: array, items: { type: string } }
              assumptions: { type: array, items: { type: string } }
              named_dissent:
                type: array
                items:
                  type: object
                  required: [participant_id, basis]
                  properties:
                    participant_id: { type: string }
                    basis: { type: string }
              falsifiers: { type: array, items: { type: string } }
              reopen_triggers: { type: array, items: { type: string } }
              edit_history:
                type: array
                description: 人工编辑留痕（正文在事件流；此处只留溯源位）
                items:
                  type: object
                  required: [event_id, edit_version, edited_by, occurred_at]
                  properties:
                    event_id: { type: string }
                    edit_version: { type: integer }
                    note: { type: string }
                    edited_by: { type: string }
                    occurred_at: { type: string, format: date-time }
        capsule_budget:
          type: object
          required: [budget_runes, injected_runes, injected_count, dropped_count]
          description: 恒常平面容量水位（Hermes 纪律：dropped_count > 0 即超预算——倒逼合并/编辑，不静默截断）
          properties:
            budget_runes: { type: integer }
            injected_runes: { type: integer }
            injected_count: { type: integer }
            dropped_count: { type: integer }
        curated:
          type: array
          description: 策展条目（v1.70，agent 每波评审自助沉淀——最新在后；注入时倒序取新）
          items:
            type: object
            required: [id, author, content, source_refs, created_at, updated_at, edited]
            properties:
              id: { type: string, description: "稳定条目 ID（mem_*，编辑面锚点）" }
              author: { type: string, description: 执行评审的 agent（署名可追溯） }
              content: { type: string }
              source_refs:
                type: array
                description: provenance——触发评审的 round_id
                items: { type: string }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
              edited: { type: boolean, description: 人工纠错过（memory.edited 链已应用） }
        curated_budget:
          type: object
          required: [budget_runes, curated_runes, curated_count, capsule_runes, capsule_count, over_budget_runes]
          description: 恒常平面合并水位（策展条目优先注入，余量给胶囊；over_budget_runes > 0 即倒逼合并）
          properties:
            budget_runes: { type: integer }
            curated_runes: { type: integer }
            curated_count: { type: integer }
            capsule_runes: { type: integer }
            capsule_count: { type: integer }
            over_budget_runes: { type: integer }
    ContextPanorama:
      type: object
      required: [room_id, watermark, near_window, retrieved, retrieval_keywords, curated_memory, capsules, budget, tasklist]
      description: 语境平面全景（GET /v1/rooms/{id}/context，v1.70 展示对齐）——与引擎组装同源的纯函数快照。
      properties:
        room_id: { type: string }
        watermark: { type: string, description: 快照水位（最新事件 ID） }
        near_window:
          type: array
          description: 近窗原文（最新 10 条，最新在前）
          items:
            type: object
            required: [event_id, actor, actor_kind, body, occurred_at]
            properties:
              event_id: { type: string }
              actor: { type: string }
              actor_kind: { type: string, enum: [human, agent, system] }
              body: { type: string }
              occurred_at: { type: string, format: date-time }
        retrieved:
          type: array
          description: 按需召回命中（近窗外旧消息，锚点关键词驱动；event_id 即 provenance）
          items:
            type: object
            required: [event_id, actor, body]
            properties:
              event_id: { type: string }
              actor: { type: string }
              body: { type: string }
        retrieval_keywords:
          type: array
          description: 召回所用关键词（自最新消息正文提取——确定性零模型）
          items: { type: string }
        curated_memory:
          type: array
          description: 恒常平面·策展条目（预算内注入集，最新在前）
          items:
            type: object
            required: [id, author, content, source_refs, created_at, updated_at, edited]
            properties:
              id: { type: string }
              author: { type: string }
              content: { type: string }
              source_refs: { type: array, items: { type: string } }
              created_at: { type: string, format: date-time }
              updated_at: { type: string, format: date-time }
              edited: { type: boolean }
        capsules:
          type: array
          description: 恒常平面·胶囊（预算余量内；同 MemoryView.capsules 条目形状）
          items:
            type: object
            required: [closure_id, closure_type, thread_id, conclusions, assumptions, named_dissent, edit_history]
            properties:
              closure_id: { type: string }
              closure_type: { type: string, enum: [consensus, bounded_disagreement] }
              thread_id: { type: string }
              watermark: { type: integer, format: int64 }
              conclusions: { type: array, items: { type: string } }
              assumptions: { type: array, items: { type: string } }
              named_dissent:
                type: array
                items:
                  type: object
                  required: [participant_id, basis]
                  properties:
                    participant_id: { type: string }
                    basis: { type: string }
              falsifiers: { type: array, items: { type: string } }
              reopen_triggers: { type: array, items: { type: string } }
              edit_history:
                type: array
                items:
                  type: object
                  required: [event_id, edit_version, edited_by, occurred_at]
                  properties:
                    event_id: { type: string }
                    edit_version: { type: integer }
                    note: { type: string }
                    edited_by: { type: string }
                    occurred_at: { type: string, format: date-time }
        budget:
          type: object
          required: [budget_runes, curated_runes, curated_count, capsule_runes, capsule_count, over_budget_runes]
          description: 恒常平面合并水位（同 MemoryView.curated_budget 形状）
          properties:
            budget_runes: { type: integer }
            curated_runes: { type: integer }
            curated_count: { type: integer }
            capsule_runes: { type: integer }
            capsule_count: { type: integer }
            over_budget_runes: { type: integer }
        tasklist:
          type: array
          description: 承诺追踪（带责任人/波龄/逾期）
          items:
            type: object
            required: [task_id, owner, requester, text, waves_since, overdue]
            properties:
              task_id: { type: string }
              owner: { type: string }
              requester: { type: string }
              text: { type: string }
              waves_since: { type: integer }
              overdue: { type: boolean }
    ReceiptListView:
      type: object
      required: [room_id, receipts]
      description: 上下文回执流水（GET /v1/rooms/{id}/receipts，v1.70 展示对齐——AR-16 正式面）。
      properties:
        room_id: { type: string }
        receipts:
          type: array
          description: 最新在前；task_id 语义后缀可辨运行类型（:eval/:gen0/:mrev）
          items:
            type: object
            required: [receipt_id, task_id, watermark, layer_digests, created_at]
            properties:
              receipt_id: { type: string }
              task_id: { type: string }
              watermark: { type: string }
              layer_digests:
                type: array
                description: 层摘要（sha256，按组装序——内容可复算验证）
                items: { type: string }
              created_at: { type: string, format: date-time }
    SearchHit:
      type: object
      required: [event_id, actor, actor_kind, body, occurred_at, position]
      description: 检索命中（对外视图：无 seq/tenant；position 供时间线跳转）。
      properties:
        event_id: { type: string }
        actor: { type: string }
        actor_kind: { type: string, enum: [human, agent, system] }
        thread_id:
          oneOf:
            - type: "null"
            - type: string
        body: { type: string }
        occurred_at: { type: string, format: date-time }
        position: { type: string, description: opaque cursor（时间线定位） }
