# oapi-codegen 生成配置（ADR-0007：边界模型生成链）。
# 只生成边界：std-http 服务接口 + 模型——领域层不得 import 本包（架构 §8.4.1）。
# 请求解码保留在 httpapi 手工实现（DisallowUnknownFields 严格拒收是 M1 复审以来的
# 契约纪律；strict-server 包装会接管解码、静默放行未知字段，故不启用）。
# 不生成 embedded-spec：内嵌的是 spec 重序列化压缩块（kin-openapi yaml 再 marshal），
# 跨环境重生成不稳定（CI 漂移门禁实证）；契约测试直接读权威源 openapi.yaml。
package: apigen
generate:
  std-http-server: true
  models: true
# 注意：output 相对调用 CWD（gen 脚本已 cd 到仓库根）解析。
output: internal/transport/httpapi/apigen/api.gen.go
