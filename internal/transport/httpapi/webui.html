<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mosaic</title>
<style>
	body { font-family: system-ui, sans-serif; margin: 0; background: #101418; color: #e6e9ee; display: flex; }
	.side { width: 280px; padding: 16px; border-right: 1px solid #232a33; }
	.main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
	#timeline { flex: 1; overflow-y: auto; padding: 16px; }
	.msg { margin: 6px 0; padding: 8px 12px; border-radius: 8px; background: #1a2027; }
	.msg.agent { border-left: 3px solid #4f8cff; }
	.msg.human { border-left: 3px solid #3ddc97; }
	.meta { font-size: 11px; color: #8b93a1; margin-bottom: 2px; }
	.draft { font-size: 12px; color: #8b93a1; font-style: italic; margin: 2px 0 2px 15px; }
	.round { font-size: 11px; color: #6b7280; margin: 10px 0 2px 15px; }
	form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #232a33; }
	input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #2a323c; background: #0d1117; color: #e6e9ee; }
	button { padding: 8px 14px; border: none; border-radius: 6px; background: #2f6fed; color: #fff; cursor: pointer; }
	button.ghost { background: #2a323c; }
	.small { font-size: 12px; color: #8b93a1; margin: 6px 0; }
</style>
</head>
<body>
	<div class="side">
		<h2 style="margin-top:0">Mosaic</h2>
		<div class="small">M1 最小 Timeline（正式 UI 随 M2）</div>
		<button onclick="createRoom()">创建房间</button>
		<div id="roomInfo" class="small" style="margin-top:10px"></div>
		<div style="margin-top:14px; display:flex; gap:6px;">
			<button class="ghost" onclick="pauseRoom()">暂停</button>
			<button class="ghost" onclick="resumeRoom()">恢复</button>
		</div>
	</div>
	<div class="main">
		<div id="timeline"><div class="small">先创建房间，然后发送消息——agent 会自动参与讨论。</div></div>
		<form onsubmit="return postMessage(event)">
			<input id="body" placeholder="输入消息，回车发送" autocomplete="off" />
			<button>发送</button>
		</form>
	</div>
<script>
let roomID = null, version = 0, es = null, idem = 0;
const timeline = document.getElementById('timeline');
function newIdem() { idem++; const h = (n)=>n.toString(16).padStart(4,'0');
  return '018f6b2e-7c1a-7' + h(idem%0x1000).slice(0,3) + '-9e4f-1a2b3c4d' + h(idem%0x10000) + h(idem%0xfff+1); }
async function api(path, body) {
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const d = await r.json();
  if (!r.ok) throw new Error(d.error ? d.error.message : r.status);
  return d;
}
async function createRoom() {
  try {
    const d = await api('/v1/rooms', {command_kind:'create_room', expected_room_version:0,
      idempotency_key:newIdem(), issued_at:new Date().toISOString(), payload:{display_name:'Web 房间'}});
    roomID = d.room_id; version = d.room_version;
    document.getElementById('roomInfo').textContent = roomID + ' @v' + version;
    timeline.innerHTML = '';
    if (es) es.close();
    es = new EventSource('/v1/rooms/' + roomID + '/events?cursor=');
    es.onmessage = () => {};
    ['message.posted','round.opened','round.closed','intent.recorded','floor.granted','room.paused','room.started'].forEach(t => es.addEventListener(t, e => onEvent(t, JSON.parse(e.data))));
    es.addEventListener('draft.update', e => {
      const d = JSON.parse(e.data);
      let el = document.getElementById('draft-' + d.participant_id);
      if (!el) { el = document.createElement('div'); el.className='draft'; el.id='draft-'+d.participant_id; timeline.appendChild(el); }
      el.textContent = d.participant_id + ' 正在输入…' + (d.text ? ' ' + d.text : '');
      if (d.kind === 'stage') el.textContent = d.participant_id + ' · ' + d.stage;
    });
  } catch (e) { alert(e.message); }
}
async function onEvent(type, d) {
  if (d.room_version) version = d.room_version;
  const draft = document.getElementById('draft-par_echo'); if (draft && type==='message.posted') draft.remove();
  if (type === 'message.posted') {
    const el = document.createElement('div');
    el.className = 'msg ' + (d.actor ? d.actor.kind : '');
    el.innerHTML = '<div class="meta">' + (d.actor ? d.actor.participant_id : '') + ' · ' + (d.occurred_at||'') + '</div>' +
      (d.payload && d.payload.body ? String(d.payload.body).replace(/</g,'&lt;') : '');
    timeline.appendChild(el);
  } else if (type === 'round.opened') {
    const el = document.createElement('div'); el.className='round'; el.textContent='— 轮开启 —'; timeline.appendChild(el);
  } else if (type === 'round.closed') {
    const el = document.createElement('div'); el.className='round'; el.textContent='— 轮结束（' + (d.payload ? d.payload.outcome : '') + '）—'; timeline.appendChild(el);
  }
  timeline.scrollTop = timeline.scrollHeight;
}
async function postMessage(ev) {
  ev.preventDefault();
  const body = document.getElementById('body').value.trim();
  if (!body || !roomID) return false;
  try {
    const d = await api('/v1/rooms/' + roomID + '/commands', {command_kind:'post_message',
      expected_room_version: version, idempotency_key:newIdem(), issued_at:new Date().toISOString(),
      payload:{body, reply_to:null, addressed_to:[], relations:[]}});
    version = d.room_version;
    document.getElementById('body').value = '';
  } catch (e) { alert(e.message); }
  return false;
}
async function pauseRoom() { if (!roomID) return; try { const d = await api('/v1/rooms/'+roomID+'/commands', {command_kind:'pause_room', expected_room_version:version, idempotency_key:newIdem(), issued_at:new Date().toISOString(), payload:{reason:'web'}}); version = d.room_version; } catch(e){ alert(e.message);} }
async function resumeRoom() { if (!roomID) return; try { const d = await api('/v1/rooms/'+roomID+'/commands', {command_kind:'resume_room', expected_room_version:version, idempotency_key:newIdem(), issued_at:new Date().toISOString(), payload:{}}); version = d.room_version; } catch(e){ alert(e.message);} }
</script>
</body>
</html>
