name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 双平台一等公民（交付规划 §5）+ linux 供服务端形态基线
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Build mosaic-server
        run: go build ./cmd/mosaic-server
