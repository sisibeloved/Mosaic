name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 双平台一等公民（交付规划 §5：macOS arm64+amd64 双架构）+ linux 供服务端形态基线
        # macos-latest = arm64；macos-13 = Intel（amd64）
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Vet (UT+IT+ST 全部标签)
        run: go vet -tags "it st" ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests
        run: go test -race -tags it ./...
      - name: System tests
        run: go test -race -tags st ./...
      - name: Build mosaic-server
        run: go build ./cmd/mosaic-server
