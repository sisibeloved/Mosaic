name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 双平台一等公民（交付规划 §5）+ linux 供服务端形态基线。
        # macOS amd64：GitHub 托管 Intel runner（macos-13，最后一档 Intel 镜像）已退役，
        # 实测排队 30min+ 无 runner（2026-08-28，platform-notes M-2）——
        # darwin/amd64 兼容改由 ubuntu 腿交叉编译门禁把守（见 cross-compile 步骤）。
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Vet (UT+IT+ST 全部标签)
        run: go vet -tags "it st" ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests
        run: go test -race -tags it ./...
      - name: System tests
        run: go test -race -tags st ./...
      # 复审 #5：生产 codex 路径不得在必跑 CI 里恒 skip——桩 CLI 走真实装配
      # （真二进制 + 真适配器 + 真子进程 + 真发布门），模型面以确定性脚本代理。
      - name: Production codex path ST (stub CLI)
        if: matrix.os == 'ubuntu-latest'
        run: |
          stub_dir="$(mktemp -d)"
          cat > "$stub_dir/codex" <<'STUB'
          #!/usr/bin/env bash
          # codex CLI 桩：仅实现 login status 与 exec --json 的最小 JSONL 契约。
          if [ "$1" = "login" ]; then echo "Logged in"; exit 0; fi
          prompt="$(cat)"
          if printf '%s' "$prompt" | grep -q '"scores"'; then
            line='{"type":"item.completed","item":{"id":"i1","type":"agent_message","text":"{\"action\":\"speak\",\"type\":\"answer\",\"public_rationale\":\"stub intent\",\"scores\":{\"relevance\":0.9,\"novelty\":0.5,\"urgency\":0.7,\"confidence\":0.8}}"}}'
          else
            line='{"type":"item.completed","item":{"id":"i1","type":"agent_message","text":"{\"body\":\"stub 回答：1+1=2\",\"declared_relations\":[]}"}}'
          fi
          printf '%s\n' '{"type":"thread.started","thread_id":"thr_stub_1"}'
          printf '%s\n' "$line"
          printf '%s\n' '{"type":"turn.completed","usage":{"input_tokens":12,"output_tokens":5}}'
          STUB
          chmod +x "$stub_dir/codex"
          MOSAIC_ST_CODEX_STUB="$stub_dir/codex" go test -race -tags st ./cmd/mosaic-server/ -run TestCodexProductionPath_ST -v
      # M2 C 轨：生产 kimi 路径同制门禁（真二进制+真适配器+真子进程+真发布门）。
      - name: Production kimi path ST (stub CLI)
        if: matrix.os == 'ubuntu-latest'
        run: |
          stub_dir="$(mktemp -d)"
          cat > "$stub_dir/kimi" <<'STUB'
          #!/usr/bin/env bash
          # kimi CLI 桩：仅实现 -p <prompt> --output-format stream-json 的最小行流契约
          # （提示词走 argv——实证 kimi -p 不读 stdin；行流形状钉 0.39.1 fixtures）。
          prompt=""
          while [ $# -gt 0 ]; do
            if [ "$1" = "-p" ]; then prompt="$2"; shift 2; continue; fi
            shift
          done
          printf '%s\n' '{"role":"meta","type":"system.version","version":"0.39.1-stub"}'
          if printf '%s' "$prompt" | grep -q '"scores"'; then
            printf '%s\n' '{"role":"assistant","content":"{\"action\":\"speak\",\"type\":\"answer\",\"public_rationale\":\"stub intent\",\"scores\":{\"relevance\":0.9,\"novelty\":0.5,\"urgency\":0.7,\"confidence\":0.8}}"}'
          else
            printf '%s\n' '{"role":"assistant","content":"{\"body\":\"stub 回答：1+1=2\",\"declared_relations\":[]}"}'
          fi
          printf '%s\n' '{"role":"meta","type":"session.resume_hint","session_id":"session_stub_1","command":"kimi -r session_stub_1"}'
          STUB
          chmod +x "$stub_dir/kimi"
          MOSAIC_ST_KIMI_STUB="$stub_dir/kimi" go test -race -tags st ./cmd/mosaic-server/ -run TestKimiProductionPath_ST -v
      - name: Build mosaic-server
        run: go build ./cmd/mosaic-server
      - name: Cross-compile gate (darwin amd64/arm64 + windows amd64)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go build ./cmd/mosaic-server
          GOOS=darwin GOARCH=amd64 go build ./cmd/mosaic-server
          GOOS=darwin GOARCH=arm64 go build ./cmd/mosaic-server
          GOOS=windows GOARCH=amd64 go build ./cmd/mosaic-server
          GOOS=windows GOARCH=arm64 go build ./cmd/mosaic-server
      # 复审 #19：漂移门禁须覆盖新增/删除产物——git diff 不看未跟踪文件，
      # 陈旧产物（生成器已不再输出）也测不出来；staged 比对全状态。
      # 四轮复审 #17：先清空 gen 树再重生——删除 schema 后遗留的旧声明此时会以
      # 删除差异出现（不清树则旧文件原样保留，staged 比对也看不见）。
      - name: gen-ts drift gate (Schema → TS 产物新鲜度)
        if: matrix.os == 'ubuntu-latest'
        run: |
          git rm -rq api/room-protocol/gen/
          bash tools/scripts/gen-ts.sh
          git add -A api/room-protocol/gen/
          if ! git diff --cached --quiet -- api/room-protocol/gen/; then
            git diff --cached -- api/room-protocol/gen/
            echo "::error::gen-ts 产物漂移（新增/修改/陈旧未清理）"
            exit 1
          fi
      # ADR-0007（M2 履约）：OpenAPI spec → Go 边界模型的新鲜度门禁。
      - name: gen-api drift gate (OpenAPI → Go 边界模型新鲜度)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rm -f internal/transport/httpapi/apigen/api.gen.go
          bash tools/scripts/gen-api.sh
          git add -A internal/transport/httpapi/apigen/
          if ! git diff --cached --quiet -- internal/transport/httpapi/apigen/; then
            git diff --cached -- internal/transport/httpapi/apigen/
            echo "::error::gen-api 产物漂移（spec 改动未重生成）"
            exit 1
          fi
