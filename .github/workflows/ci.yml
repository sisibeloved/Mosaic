name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 双平台一等公民（交付规划 §5）+ linux 供服务端形态基线。
        # macOS amd64：GitHub 托管 Intel runner（macos-13，最后一档 Intel 镜像）已退役，
        # 实测排队 30min+ 无 runner（2026-08-28，platform-notes M-2）——
        # darwin/amd64 兼容改由 ubuntu 腿交叉编译门禁把守（见 cross-compile 步骤）。
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Vet (UT+IT+ST 全部标签)
        run: go vet -tags "it st" ./...
      - name: Unit tests
        run: go test -race ./...
      - name: Integration tests
        run: go test -race -tags it ./...
      - name: System tests
        run: go test -race -tags st ./...
      - name: Build mosaic-server
        run: go build ./cmd/mosaic-server
      - name: Cross-compile gate (darwin amd64/arm64 + windows amd64)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go build ./cmd/mosaic-server
          GOOS=darwin GOARCH=amd64 go build ./cmd/mosaic-server
          GOOS=darwin GOARCH=arm64 go build ./cmd/mosaic-server
          GOOS=windows GOARCH=amd64 go build ./cmd/mosaic-server
          GOOS=windows GOARCH=arm64 go build ./cmd/mosaic-server
      - name: gen-ts drift gate (Schema → TS 产物新鲜度)
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash tools/scripts/gen-ts.sh
          git diff --exit-code -- api/room-protocol/gen/
